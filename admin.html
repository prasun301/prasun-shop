<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prasun Shop Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logout-btn {
            background-color: #ff4444;
            color: white;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <header>
        <div class="container header-content">
            <h1>Prasun Shop Admin</h1>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </header>

    <section class="products">
        <div class="container">
            <h2>Customer Orders</h2>
            
            <table border="1" width="100%">
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Customer</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Product</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="orders">
                    <tr>
                        <td colspan="8">Loading orders...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <script>
        const API_URL = "https://prasun-shop-api.prasun301.workers.dev";
        let productsList = [];

        // ==========================
        // 1. INITIALIZE (Fixes the Race Condition)
        // ==========================
        async function init() {
            const isValid = await verifySession();
            if (isValid) {
                await loadProductsAndOrders();
            }
        }

        // ==========================
        // 2. VERIFY SESSION
        // ==========================
        async function verifySession() {
            const token = localStorage.getItem("sessionToken");

            if (!token) {
                window.location.href = "login.html";
                return false;
            }

            try {
                const response = await fetch(`${API_URL}/verify-session`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token })
                });

                const result = await response.json();

                if (!result.valid) {
                    localStorage.removeItem("sessionToken");
                    window.location.href = "login.html";
                    return false;
                }
                return true; // Valid session!
            } catch (error) {
                console.error("Failed to verify session:", error);
                window.location.href = "login.html";
                return false;
            }
        }

        // ==========================
        // 3. LOGOUT
        // ==========================
        async function logout() {
            const token = localStorage.getItem("sessionToken");
            
            if (token) {
                // Tell the backend to destroy the session
                await fetch(`${API_URL}/logout`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token })
                });
            }

            // Clear local storage and redirect
            localStorage.removeItem("sessionToken");
            window.location.href = "login.html";
        }

        // ==========================
        // 4. LOAD PRODUCTS & ORDERS
        // ==========================
        async function loadProductsAndOrders() {
            // Load products first
            const prodResponse = await fetch("data/products.json");
            productsList = await prodResponse.json();

            // Then load orders (Sending the Authorization header!)
            const orderResponse = await fetch(`${API_URL}/`, {
                method: "GET",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": localStorage.getItem("sessionToken") // The security fix
                }
            });

            if (orderResponse.status === 401) {
                logout(); // If unauthorized, kick them out
                return;
            }

            const orders = await orderResponse.json();
            renderOrders(orders);
        }

        function renderOrders(orders) {
            let table = document.getElementById("orders");
            table.innerHTML = "";

            orders.forEach(order => {
                let cart = JSON.parse(order.products);
                let productText = "";

                cart.forEach(item => {
                    let product = productsList.find(p => p.id === item.id);
                    if (product) {
                        productText += `${product.name} &times; ${item.quantity}<br>`;
                    } else {
                        productText += `${item.id} &times; ${item.quantity}<br>`;
                    }
                });

                table.innerHTML += `
                    <tr>
                        <td>${order.id}</td>
                        <td>${order.customer_name}</td>
                        <td>${order.email}</td>
                        <td>${order.phone}</td>
                        <td>${productText}</td>
                        <td>$${order.total}</td>
                        <td>
                            <select onchange="updateStatus(${order.id}, this.value)">
                                <option value="Pending" ${order.status === "Pending" ? "selected" : ""}>Pending</option>
                                <option value="Processing" ${order.status === "Processing" ? "selected" : ""}>Processing</option>
                                <option value="Shipped" ${order.status === "Shipped" ? "selected" : ""}>Shipped</option>
                                <option value="Completed" ${order.status === "Completed" ? "selected" : ""}>Completed</option>
                                <option value="Cancelled" ${order.status === "Cancelled" ? "selected" : ""}>Cancelled</option>
                            </select>
                        </td>
                        <td>${order.created_at}</td>
                    </tr>
                `;
            });
        }

        // ==========================
        // 5. UPDATE ORDER STATUS
        // ==========================
        async function updateStatus(id, status) {
            const response = await fetch(`${API_URL}/`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": localStorage.getItem("sessionToken") // The security fix
                },
                body: JSON.stringify({ id: id, status: status })
            });

            if (response.status === 401) {
                logout();
                return;
            }

            const result = await response.json();
            if (result.success) {
                alert("Order status updated.");
            }
        }

        // Boot up the page safely
        init();

    </script>
</body>
</html>
