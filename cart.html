<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shopping Cart | Prasun Shop</title>

  <meta
    name="description"
    content="Review your shopping cart and proceed securely to checkout at Prasun Shop."
  >

  <link rel="stylesheet" href="css/style.css">

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header class="site-header">

  <div class="container header-inner">


    <!-- Brand -->

    <a
      href="index.html"
      class="brand"
      aria-label="Prasun Shop home"
    >

      <span class="brand-icon" aria-hidden="true">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <path d="M3 5h2l2.2 10.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 8H6"/>
          <circle cx="10" cy="20" r="1"/>
          <circle cx="18" cy="20" r="1"/>
        </svg>

      </span>

      <span class="brand-name">
        Prasun Shop
      </span>

      <span class="brand-dot" aria-hidden="true">.</span>

    </a>


    <!-- Desktop Navigation -->

    <nav
      class="desktop-nav"
      aria-label="Main navigation"
    >

      <a href="index.html">
        Home
      </a>

      <a href="products.html">
        Products
      </a>

    </nav>


    <!-- Header Actions -->

    <div class="header-actions">


      <!-- Cart -->

      <a
        href="cart.html"
        class="header-cart"
        aria-label="Shopping Cart"
      >

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          aria-hidden="true"
        >
          <path d="M6 6h15l-1.5 9h-12z"/>
          <path d="M6 6 5 3H2"/>
          <circle cx="9" cy="20" r="1"/>
          <circle cx="18" cy="20" r="1"/>
        </svg>

        <span
          id="cart-count"
          class="cart-badge"
          aria-label="Items in cart"
        >
          0
        </span>

      </a>


      <!-- Mobile Menu -->

      <button
        type="button"
        id="mobile-menu-button"
        class="mobile-menu-button"
        aria-expanded="false"
        aria-controls="mobile-menu"
        aria-label="Open navigation menu"
      >

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          aria-hidden="true"
        >
          <path d="M4 6h16"/>
          <path d="M4 12h16"/>
          <path d="M4 18h16"/>
        </svg>

      </button>

    </div>

  </div>


  <!-- Mobile Navigation -->

  <div
    id="mobile-menu"
    class="mobile-menu"
    hidden
  >

    <a href="index.html">
      Home
    </a>

    <a href="products.html">
      Products
    </a>

    <a href="cart.html">
      Cart
    </a>

  </div>

</header>



<!-- =========================================================
     MAIN
========================================================= -->

<main class="cart-page">

  <div class="container">


    <!-- Breadcrumb -->

    <nav
      class="cart-breadcrumb"
      aria-label="Breadcrumb"
    >

      <a href="index.html">
        Home
      </a>

      <span aria-hidden="true">
        /
      </span>

      <span aria-current="page">
        Cart
      </span>

    </nav>


    <!-- Page Header -->

    <header class="cart-header">

      <h1>
        Your Shopping Cart
      </h1>

      <p>
        Review your items before checkout.
      </p>

    </header>


    <!-- Cart Layout -->

    <div class="cart-layout">


      <!-- =====================================================
           CART ITEMS
      ====================================================== -->

      <section
        class="cart-products"
        aria-label="Shopping cart items"
      >

        <div id="cart-items">

          <!-- cart.js renders items here -->

        </div>

      </section>



      <!-- =====================================================
           ORDER SUMMARY
      ====================================================== -->

      <aside
        class="cart-summary"
        aria-label="Order summary"
      >

        <div class="cart-summary-inner">

          <h2>
            Order Summary
          </h2>


          <div class="cart-summary-row">

            <span>
              Subtotal
            </span>

            <strong id="cart-total">
              $0.00
            </strong>

          </div>


          <p class="cart-summary-note">
            Taxes and payment details are calculated at checkout.
          </p>


          <button
            type="button"
            id="checkout-button"
            class="checkout-button"
          >
            Proceed to Checkout
          </button>


          <a
            href="products.html"
            class="continue-shopping"
          >
            Continue Shopping
          </a>

        </div>

      </aside>

    </div>

  </div>

</main>



<!-- =========================================================
     SCRIPTS
========================================================= -->

<script src="js/cart.js"></script>

<script>

document.addEventListener("DOMContentLoaded", () => {

  const menuButton =
    document.getElementById("mobile-menu-button");

  const mobileMenu =
    document.getElementById("mobile-menu");

  const checkoutButton =
    document.getElementById("checkout-button");


  /* Mobile menu */

  if (menuButton && mobileMenu) {

    menuButton.addEventListener("click", () => {

      const isOpen =
        menuButton.getAttribute("aria-expanded") === "true";

      menuButton.setAttribute(
        "aria-expanded",
        String(!isOpen)
      );

      mobileMenu.hidden = isOpen;

    });

  }


  /* Checkout */

  if (checkoutButton) {

    checkoutButton.addEventListener("click", () => {

      const cart =
        JSON.parse(
          localStorage.getItem("cart") || "[]"
        );

      if (!cart.length) {

        return;

      }

      window.location.href = "checkout.html";

    });

  }

});

</script>


</body>

</html>
