<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Review Your Bag — PRASUN SHOP</title>
  <style>
    :root {
      --apple-bg: #f5f5f7;
      --apple-card-bg: #ffffff;
      --apple-text: #1d1d1f;
      --apple-gray: #86868b;
      --apple-border: #d2d2d7;
      --apple-dark: #1d1d1f;
      --apple-dark-hover: #333336;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--apple-card-bg);
      color: var(--apple-text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      margin: 0;
      -webkit-font-smoothing: antialiased;
    }

    .header {
      border-bottom: 1px solid var(--apple-border);
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      z-index: 100;
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--apple-text);
      font-weight: 600;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--apple-gray);
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: var(--apple-text); }

    .cart-icon-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      color: var(--apple-text);
      text-decoration: none;
    }

    .cart-badge {
      position: absolute;
      top: -8px;
      right: -10px;
      background-color: var(--apple-dark);
      color: white;
      font-size: 0.7rem;
      font-weight: 600;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: inline-flex;
      justify-content: center;
      align-items: center;
    }

    .main-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 3rem 2rem;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .page-title {
      font-size: 2.25rem;
      font-weight: 700;
      margin: 0;
    }

    .btn-clear {
      background: transparent;
      border: 1px solid var(--apple-border);
      color: var(--apple-gray);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .btn-clear:hover {
      border-color: var(--apple-dark);
      color: var(--apple-dark);
    }

    .cart-card {
      background-color: var(--apple-bg);
      border: 1px solid var(--apple-border);
      border-radius: 20px;
      padding: 3rem 2rem;
      min-height: 350px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .btn-primary {
      display: inline-block;
      background-color: var(--apple-dark);
      color: #ffffff;
      padding: 0.8rem 2rem;
      border-radius: 980px;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: background-color 0.2s;
    }

    .btn-primary:hover { background-color: var(--apple-dark-hover); }

    .cart-items-wrapper { width: 100%; text-align: left; }

    .cart-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 0;
      border-bottom: 1px solid var(--apple-border);
    }

    .cart-item-info {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .cart-item-info img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid var(--apple-border);
      padding: 6px;
    }

    .cart-summary-footer {
      width: 100%;
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1rem;
      border-top: 1px solid var(--apple-border);
      padding-top: 1.5rem;
    }

    .summary-line {
      display: flex;
      justify-content: space-between;
      width: 300px;
      font-size: 1rem;
      color: var(--apple-gray);
    }

    .summary-line.total {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--apple-text);
      border-top: 1px solid var(--apple-border);
      padding-top: 0.8rem;
    }

    .footer {
      border-top: 1px solid var(--apple-border);
      background-color: var(--apple-bg);
      padding: 2.5rem;
      text-align: center;
      color: var(--apple-gray);
      font-size: 0.85rem;
      margin-top: 4rem;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-container">
      <a href="index.html" class="logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
        <span>PRASUN SHOP</span>
      </a>
      <nav class="nav-links">
        <a href="index.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <a href="cart.html" class="cart-icon-wrap">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span id="cart-count" class="cart-badge">0</span>
      </a>
    </div>
  </header>

  <main class="main-container">
    <div class="page-header">
      <h1 class="page-title">Review Your Bag</h1>
      <button class="btn-clear" onclick="clearCart()">Clear Cart</button>
    </div>
    <div class="cart-card" id="cart-card-content"></div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 PRASUN SHOP. All rights reserved.</p>
  </footer>

  <script>
    function updateCartBadge() {
      try {
        const cart = JSON.parse(localStorage.getItem('prasun_cart')) || [];
        const totalItems = cart.reduce((sum, item) => sum + (Number(item.quantity) || 1), 0);
        const badge = document.getElementById('cart-count');
        if (badge) badge.textContent = totalItems;
      } catch (e) { console.error(e); }
    }

    function renderCart() {
      updateCartBadge();
      let cart = [];
      try {
        cart = JSON.parse(localStorage.getItem('prasun_cart')) || [];
      } catch (e) { cart = []; }

      const container = document.getElementById('cart-card-content');

      if (cart.length === 0) {
        container.innerHTML = `
          <div style="text-align: center;">
            <h3 style="font-size: 1.5rem; font-weight: 600; margin: 0 0 0.5rem 0;">Your cart is empty</h3>
            <p style="color: var(--apple-gray); font-size: 0.95rem; margin: 0 0 1.5rem 0;">Discover our latest products and add something you love.</p>
            <a href="index.html" class="btn-primary">Continue Shopping</a>
          </div>
        `;
        return;
      }

      let itemsHTML = '<div class="cart-items-wrapper">';
      let subtotal = 0;

      cart.forEach((item, index) => {
        const priceNum = parseFloat(item.price.replace('$', '')) || 0;
        const qty = Number(item.quantity) || 1;
        subtotal += priceNum * qty;

        itemsHTML += `
          <div class="cart-item-row">
            <div class="cart-item-info">
              <img src="${item.image}" alt="${item.title}" />
              <div>
                <h4 style="margin: 0 0 0.3rem 0; font-size: 1.05rem; font-weight: 600;">${item.title}</h4>
                <p style="margin: 0; color: var(--apple-gray); font-size: 0.9rem;">Qty: ${qty}</p>
              </div>
            </div>
            <div style="display: flex; align-items: center; gap: 2rem;">
              <span style="font-weight: 600; font-size: 1.05rem;">$${(priceNum * qty).toFixed(2)}</span>
              <button style="background:none; border:none; color:var(--apple-gray); cursor:pointer;" onclick="removeItem(${index})">Remove</button>
            </div>
          </div>
        `;
      });

      itemsHTML += `</div>`;
      const shipping = 5.00;
      const total = subtotal + shipping;

      itemsHTML += `
        <div class="cart-summary-footer">
          <div class="summary-line"><span>Subtotal</span><span>$${subtotal.toFixed(2)}</span></div>
          <div class="summary-line"><span>Shipping</span><span>$${shipping.toFixed(2)}</span></div>
          <div class="summary-line total"><span>Total</span><span>$${total.toFixed(2)}</span></div>
          <div style="display: flex; gap: 1rem; margin-top: 1rem;">
            <a href="index.html" class="btn-primary" style="background: transparent; color: var(--apple-text); border: 1px solid var(--apple-border);">Continue Shopping</a>
            <a href="checkout.html" class="btn-primary">Proceed to Checkout</a>
          </div>
        </div>
      `;

      container.innerHTML = itemsHTML;
    }

    function removeItem(index) {
      let cart = JSON.parse(localStorage.getItem('prasun_cart')) || [];
      cart.splice(index, 1);
      localStorage.setItem('prasun_cart', JSON.stringify(cart));
      renderCart();
    }

    function clearCart() {
      localStorage.removeItem('prasun_cart');
      renderCart();
    }

    document.addEventListener('DOMContentLoaded', renderCart);
  </script>
</body>
</html>
