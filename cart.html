<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Shopping Cart — PRASUN SHOP</title>

    <meta
        name="description"
        content="Review your shopping cart and proceed to checkout at PRASUN SHOP."
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <link
        rel="canonical"
        href="https://shop.prasunbarua.com/cart.html"
    >

    <link
        rel="icon"
        href="/favicon.ico"
        sizes="any"
    >

    <!-- Main stylesheet -->
    <link
        rel="stylesheet"
        href="/css/style.css?v=20260820-02"
    >

    <!-- Cart page styles -->
    <style>

        /* ============================================================
           ACCESSIBILITY
           ============================================================ */

        .visually-hidden {
            position: absolute !important;
            width: 1px !important;
            height: 1px !important;
            padding: 0 !important;
            margin: -1px !important;
            overflow: hidden !important;
            clip: rect(0, 0, 0, 0) !important;
            clip-path: inset(50%) !important;
            white-space: nowrap !important;
            border: 0 !important;
        }

        .cart-count[hidden] {
            display: none !important;
        }


        /* ============================================================
           CART PAGE
           ============================================================ */

        .cart-page {
            width: min(1200px, calc(100% - 32px));
            margin: 0 auto;
            padding: 42px 0 70px;
        }

        .cart-page-header {
            margin-bottom: 28px;
        }

        .cart-page-title {
            margin: 0 0 8px;
            color: #0f172a;
            font-size: clamp(1.8rem, 3vw, 2.4rem);
            font-weight: 800;
            line-height: 1.2;
        }

        .cart-page-subtitle {
            margin: 0;
            color: #64748b;
            font-size: 0.96rem;
            line-height: 1.6;
        }


        /* ============================================================
           CART LAYOUT
           ============================================================ */

        .cart-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 350px;
            gap: 24px;
            align-items: start;
        }

        .cart-items-section,
        .cart-summary-section {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.05);
        }

        .cart-items-section {
            padding: 22px;
        }


        /* ============================================================
           ITEMS HEADER
           ============================================================ */

        .cart-items-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding-bottom: 17px;
            border-bottom: 1px solid #e2e8f0;
        }

        .cart-items-heading {
            margin: 0;
            color: #0f172a;
            font-size: 1.15rem;
            font-weight: 800;
        }

        .cart-items-count {
            color: #64748b;
            font-size: 0.88rem;
            font-weight: 600;
            white-space: nowrap;
        }


        /* ============================================================
           CART ITEMS CONTAINER
           ============================================================ */

        #cart-items {
            min-height: 80px;
        }


        /* ============================================================
           CART ITEM
           ============================================================ */

        .cart-item {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 20px;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .cart-item:last-child {
            border-bottom: 0;
        }

        .cart-item-product {
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 0;
        }

        .cart-item-image-link {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 90px;
            width: 90px;
            height: 90px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: #f8fafc;
        }

        .cart-item-image {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cart-item-info {
            min-width: 0;
        }

        .cart-item-category {
            display: block;
            margin-bottom: 5px;
            color: #2563eb;
            font-size: 0.74rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .cart-item-title {
            margin: 0;
            font-size: 1rem;
            line-height: 1.4;
            font-weight: 700;
        }

        .cart-item-title a {
            color: #0f172a;
            text-decoration: none;
        }

        .cart-item-title a:hover {
            color: #2563eb;
        }

        .cart-item-price {
            margin: 7px 0 0;
            color: #64748b;
            font-size: 0.88rem;
        }


        /* ============================================================
           CART CONTROLS
           ============================================================ */

        .cart-item-controls {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 18px;
        }

        .quantity-control {
            display: inline-flex;
            align-items: center;
            height: 40px;
            overflow: hidden;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            background: #ffffff;
        }

        .quantity-control button {
            width: 36px;
            height: 38px;
            padding: 0;
            border: 0;
            background: #f8fafc;
            color: #334155;
            font-family: system-ui, sans-serif;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .quantity-control button:hover {
            background: #eff6ff;
            color: #2563eb;
        }

        .quantity-input {
            width: 45px;
            height: 38px;
            padding: 0 4px;
            border: 0;
            border-left: 1px solid #e2e8f0;
            border-right: 1px solid #e2e8f0;
            background: #ffffff;
            color: #0f172a;
            text-align: center;
            font-family: system-ui, sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            outline: none;
            -moz-appearance: textfield;
        }

        .quantity-input::-webkit-inner-spin-button,
        .quantity-input::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .cart-item-subtotal {
            min-width: 90px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .cart-item-subtotal strong {
            color: #0f172a;
            font-size: 1rem;
            font-weight: 800;
            white-space: nowrap;
        }

        .cart-remove-button {
            margin-top: 5px;
            padding: 0;
            border: 0;
            background: transparent;
            color: #dc2626;
            font-family: system-ui, sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .cart-remove-button:hover {
            color: #991b1b;
            text-decoration: underline;
        }


        /* ============================================================
           EMPTY CART
           ============================================================ */

        .cart-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 320px;
            padding: 40px 20px;
            text-align: center;
        }

        .cart-empty h2 {
            margin: 0 0 8px;
            color: #0f172a;
            font-size: 1.35rem;
            font-weight: 800;
        }

        .cart-empty p {
            max-width: 460px;
            margin: 0 auto 22px;
            color: #64748b;
            line-height: 1.6;
        }

        .continue-shopping {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0 20px;
            border-radius: 10px;
            background: #2563eb;
            color: #ffffff;
            font-size: 0.92rem;
            font-weight: 700;
            text-decoration: none;
        }

        .continue-shopping:hover {
            background: #1d4ed8;
        }


        /* ============================================================
           SUMMARY
           ============================================================ */

        .cart-summary-section {
            position: sticky;
            top: 90px;
            padding: 24px;
        }

        .cart-summary-section h2 {
            margin: 0 0 22px;
            color: #0f172a;
            font-size: 1.2rem;
            font-weight: 800;
        }

        .summary-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 14px;
            color: #475569;
            font-size: 0.94rem;
        }

        .summary-row strong {
            color: #0f172a;
            font-weight: 700;
        }

        .summary-total {
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid #e2e8f0;
        }

        #cart-total {
            color: #0f172a;
            font-size: 1.25rem;
            font-weight: 800;
        }


        /* ============================================================
           BUTTONS
           ============================================================ */

        #checkout-button,
        #clear-cart-button {
            width: 100%;
            min-height: 46px;
            border-radius: 10px;
            font-family: system-ui, sans-serif;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
        }

        #checkout-button {
            margin-top: 22px;
            border: 0;
            background: #2563eb;
            color: #ffffff;
        }

        #checkout-button:hover:not(:disabled) {
            background: #1d4ed8;
        }

        #checkout-button:disabled {
            background: #cbd5e1;
            color: #64748b;
            cursor: not-allowed;
        }

        #clear-cart-button {
            margin-top: 10px;
            border: 1px solid #fecaca;
            background: #fff7f7;
            color: #dc2626;
        }

        #clear-cart-button:hover:not(:disabled) {
            background: #fef2f2;
            border-color: #fca5a5;
        }

        #clear-cart-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }


        /* ============================================================
           STATUS
           ============================================================ */

        .cart-status {
            padding: 40px 20px;
            text-align: center;
            color: #64748b;
            line-height: 1.6;
        }


        /* ============================================================
           FOCUS
           ============================================================ */

        button:focus-visible,
        a:focus-visible,
        input:focus-visible {
            outline: 3px solid rgba(37, 99, 235, 0.25);
            outline-offset: 2px;
        }


        /* ============================================================
           RESPONSIVE
           ============================================================ */

        @media (max-width: 900px) {

            .cart-layout {
                grid-template-columns: 1fr;
            }

            .cart-summary-section {
                position: static;
            }

        }


        @media (max-width: 640px) {

            .cart-page {
                width: calc(100% - 24px);
                padding: 28px 0 50px;
            }

            .cart-items-section,
            .cart-summary-section {
                padding: 16px;
                border-radius: 14px;
            }

            .cart-item {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .cart-item-product {
                align-items: flex-start;
                gap: 12px;
            }

            .cart-item-image-link {
                flex-basis: 76px;
                width: 76px;
                height: 76px;
            }

            .cart-item-controls {
                width: 100%;
                justify-content: space-between;
            }

            .cart-item-subtotal {
                min-width: auto;
            }

        }


        @media (max-width: 420px) {

            .cart-item-controls {
                flex-wrap: wrap;
                align-items: flex-end;
            }

            .cart-item-subtotal {
                margin-left: auto;
            }

        }


        /* ============================================================
           REDUCED MOTION
           ============================================================ */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition: none !important;
                animation: none !important;
            }

        }

    </style>

</head>


<body>


    <!-- ================================================================
         HEADER
         ================================================================ -->

    <header class="site-header">

        <div class="container">

            <a
                href="/"
                class="site-logo logo"
                aria-label="PRASUN SHOP Homepage"
            >

                <svg
                    width="22"
                    height="22"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <path d="M3 9l9-6 9 6"></path>
                    <path d="M5 10v10h14V10"></path>
                    <path d="M9 20v-6h6v6"></path>
                </svg>

                <span>PRASUN SHOP</span>

            </a>


            <nav
                class="nav-links"
                aria-label="Main navigation"
            >

                <a href="/">
                    Shop
                </a>

                <a
                    href="/cart.html"
                    class="cart-link active"
                    aria-current="page"
                    aria-label="View Shopping Cart"
                >

                    <span>Cart</span>

                    <span
                        id="cart-count"
                        class="cart-count"
                        hidden
                        aria-label="0 items in cart"
                    >
                        0
                    </span>

                </a>

                <a href="/about.html">
                    About
                </a>

                <a href="/contact.html">
                    Contact
                </a>

            </nav>

        </div>

    </header>


    <!-- ================================================================
         MAIN
         ================================================================ -->

    <main
        class="cart-page"
        id="main-content"
    >

        <header class="cart-page-header">

            <h1 class="cart-page-title">
                Shopping Cart
            </h1>

            <p class="cart-page-subtitle">
                Review your items and proceed to checkout.
            </p>

        </header>


        <div class="cart-layout">


            <!-- ========================================================
                 CART ITEMS
                 ======================================================== -->

            <section
                class="cart-items-section"
                aria-labelledby="cart-items-heading"
            >

                <div class="cart-items-header">

                    <h2
                        id="cart-items-heading"
                        class="cart-items-heading"
                    >
                        Your Items
                    </h2>

                    <span
                        id="cart-items-count"
                        class="cart-items-count"
                    >
                        0 items
                    </span>

                </div>


                <div
                    id="cart-items"
                    aria-live="polite"
                    aria-busy="false"
                >

                    <div class="cart-status">
                        Loading cart...
                    </div>

                </div>

            </section>


            <!-- ========================================================
                 ORDER SUMMARY
                 ======================================================== -->

            <aside
                class="cart-summary-section"
                aria-labelledby="cart-summary-heading"
            >

                <h2 id="cart-summary-heading">
                    Order Summary
                </h2>


                <div class="summary-row">

                    <span>
                        Items
                    </span>

                    <strong id="summary-item-count">
                        0
                    </strong>

                </div>


                <div class="summary-row">

                    <span>
                        Subtotal
                    </span>

                    <strong id="cart-subtotal">
                        $0.00
                    </strong>

                </div>


                <div class="summary-row summary-total">

                    <span>
                        Total
                    </span>

                    <strong id="cart-total">
                        $0.00
                    </strong>

                </div>


                <button
                    type="button"
                    id="checkout-button"
                    disabled
                    aria-disabled="true"
                >
                    Proceed to Checkout
                </button>


                <button
                    type="button"
                    id="clear-cart-button"
                    disabled
                >
                    Clear Cart
                </button>

            </aside>

        </div>

    </main>


    <!-- ================================================================
         FOOTER
         ================================================================ -->

    <footer class="footer">

        <div class="container">

            <div class="footer-links">

                <a href="/privacy.html">
                    Privacy Policy
                </a>

                <a href="/terms.html">
                    Terms of Service
                </a>

                <a href="/refund.html">
                    Refund Policy
                </a>

                <a href="/contact.html">
                    Contact
                </a>

            </div>


            <p>
                &copy; 2026 PRASUN SHOP by

                <a
                    href="https://prasunbarua.com"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Prasun Barua
                </a>.

                All rights reserved.
            </p>

        </div>

    </footer>


    <!-- ================================================================
         ACCESSIBILITY LIVE REGION
         ================================================================ -->

    <div
        id="cart-live-region"
        class="visually-hidden"
        aria-live="polite"
        aria-atomic="true"
    ></div>


    <!-- ================================================================
         CART JAVASCRIPT
         ================================================================ -->

    <script
        src="/js/cart.js?v=20260820-02"
        defer
    ></script>

</body>

</html>
