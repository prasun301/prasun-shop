<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping Cart — PRASUN SHOP</title>
  <meta name="description" content="Review your shopping cart items and proceed to checkout." />
  <style>
    :root {
      --apple-bg: #f5f5f7;
      --apple-text: #1d1d1f;
      --apple-gray: #86868b;
      --apple-border: #d2d2d7;
      --apple-blue: #0071e3;
      --apple-blue-hover: #0077ed;
      --apple-danger: #ff3b30;
    }

    body {
      background-color: #ffffff;
      color: var(--apple-text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      margin: 0;
      -webkit-font-smoothing: antialiased;
    }

    .header {
      border-bottom: 1px solid var(--apple-border);
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      z-index: 100;
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--apple-text);
      font-weight: 600;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--apple-gray);
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--apple-text);
    }

    .cart-icon-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      color: var(--apple-text);
      text-decoration: none;
    }

    .cart-badge {
      position: absolute;
      top: -8px;
      right: -10px;
      background-color: var(--apple-blue);
      color: white;
      font-size: 0.7rem;
      font-weight: 600;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: inline-flex;
      justify-content: center;
      align-items: center;
    }

    .cart-page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 3rem 2rem 5rem 2rem;
    }

    .cart-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .cart-page h1 {
      font-size: 2.25rem;
      font-weight: 600;
      letter-spacing: -0.015em;
      margin: 0;
    }

    .btn-clear {
      background: none;
      border: 1px solid var(--apple-border);
      color: var(--apple-gray);
      font-size: 0.85rem;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-clear:hover {
      border-color: var(--apple-danger);
      color: var(--apple-danger);
    }

    .cart-layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 3rem;
      align-items: start;
    }

    @media (max-width: 900px) {
      .cart-layout {
        grid-template-columns: 1fr;
        gap: 2rem;
      }
    }

    .cart-items-container {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .cart-item-card {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 1.5rem;
      background-color: var(--apple-bg);
      border-radius: 16px;
      border: 1px solid var(--apple-border);
    }

    .cart-item-image {
      width: 90px;
      height: 90px;
      background-color: #fff;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0.5rem;
      flex-shrink: 0;
    }

    .cart-item-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      mix-blend-mode: multiply;
    }

    .cart-item-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .cart-item-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--apple-text);
      text-decoration: none;
    }

    .cart-item-title:hover {
      color: var(--apple-blue);
    }

    .cart-item-price {
      font-size: 0.95rem;
      color: var(--apple-gray);
    }

    .cart-item-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 0.5rem;
    }

    .quantity-selector {
      display: flex;
      align-items: center;
      border: 1px solid var(--apple-border);
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
    }

    .qty-btn {
      background: none;
      border: none;
      padding: 0.4rem 0.8rem;
      cursor: pointer;
      font-size: 1rem;
      color: var(--apple-text);
    }

    .qty-btn:hover {
      background-color: var(--apple-bg);
    }

    .qty-value {
      padding: 0 0.5rem;
      font-size: 0.9rem;
      font-weight: 500;
      min-width: 20px;
      text-align: center;
    }

    .btn-remove {
      background: none;
      border: none;
      color: var(--apple-danger);
      font-size: 0.85rem;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
    }

    .order-summary {
      background-color: var(--apple-bg);
      border: 1px solid var(--apple-border);
      border-radius: 18px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .order-summary h2 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
      color: var(--apple-gray);
    }

    .summary-row.total {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--apple-text);
      border-top: 1px solid var(--apple-border);
      padding-top: 1rem;
      margin-top: 0.5rem;
    }

    .btn-apple-primary {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      background-color: var(--apple-blue);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 500;
      padding: 0.9rem 2rem;
      border-radius: 980px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.2s ease;
      box-shadow: 0 4px 14px rgba(0, 113, 227, 0.3);
      text-align: center;
      width: 100%;
      box-sizing: border-box;
    }

    .btn-apple-primary:hover {
      background-color: var(--apple-blue-hover);
    }

    .empty-cart {
      text-align: center;
      padding: 4rem 1rem;
      background: var(--apple-bg);
      border-radius: 18px;
      border: 1px solid var(--apple-border);
    }

    .empty-cart h2 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .empty-cart p {
      color: var(--apple-gray);
      margin-bottom: 1.5rem;
    }

    .empty-cart .btn-apple-primary {
      max-width: 220px;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-container">
      <a href="index.html" class="logo" aria-label="PRASUN SHOP Homepage">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
        <span>PRASUN SHOP</span>
      </a>
      <nav class="nav-links" aria-label="Main Navigation">
        <a href="index.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="checkout.html">Checkout</a>
      </nav>
      <div class="header-actions">
        <a href="cart.html" class="cart-icon-wrap" aria-label="View Shopping Cart">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span id="cart-count" class="cart-badge">0</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="cart-page">
    <div class="cart-header-row">
      <h1>Review Your Bag</h1>
      <button type="button" class="btn-clear" onclick="clearEntireCart()">Clear Cart</button>
    </div>
    <div id="cart-content-area">
      <!-- Dynamically populated -->
    </div>
  </main>

  <script>
    function getCart() {
      try {
        const data = localStorage.getItem('prasun_cart');
        return data ? JSON.parse(data) : [];
      } catch (e) {
        console.error("Cart storage parse error:", e);
        return [];
      }
    }

    function saveCart(cart) {
      try {
        localStorage.setItem('prasun_cart', JSON.stringify(cart));
      } catch (e) {
        console.error("Cart storage save error:", e);
      }
      updateCartBadge();
      renderCart();
    }

    function updateCartBadge() {
      const cart = getCart();
      const totalItems = cart.reduce((sum, item) => sum + (Number(item.quantity) || 1), 0);
      const badge = document.getElementById('cart-count');
      if (badge) {
        badge.textContent = totalItems;
      }
    }

    function renderCart() {
      updateCartBadge();
      const container = document.getElementById('cart-content-area');
      if (!container) return;

      let cart = [];
      try {
        cart = getCart();
      } catch (err) {
        container.innerHTML = `<div class="empty-cart"><h2>Error loading cart</h2><p>Your cart data appears corrupted.</p><button class="btn-apple-primary" onclick="clearEntireCart()">Reset Cart</button></div>`;
        return;
      }

      if (!Array.isArray(cart) || cart.length === 0) {
        container.innerHTML = `
          <div class="empty-cart">
            <h2>Your cart is empty</h2>
            <p>Discover our latest products and add something you love to your cart.</p>
            <a href="index.html" class="btn-apple-primary">Continue Shopping</a>
          </div>
        `;
        return;
      }

      let subtotal = 0;
      let itemsHTML = '';

      cart.forEach((item, index) => {
        const title = item.title || "Selected Item";
        const priceStr = item.price || "$0.00";
        const priceNum = parseFloat(priceStr.toString().replace('$', '')) || 0;
        const qty = Number(item.quantity) || 1;
        const itemTotal = priceNum * qty;
        subtotal += itemTotal;
        const image = item.image || "images/placeholder.jpg";
        const id = item.id || "#";

        itemsHTML += `
          <div class="cart-item-card">
            <div class="cart-item-image">
              <img src="${image}" alt="${title}" width="90" height="90" onerror="this.src='images/placeholder.jpg'" />
            </div>
            <div class="cart-item-details">
              <a href="product.html?id=${id}" class="cart-item-title">${title}</a>
              <span class="cart-item-price">${priceStr}</span>
              <div class="cart-item-actions">
                <div class="quantity-selector">
                  <button type="button" class="qty-btn" onclick="updateQty(${index}, -1)">−</button>
                  <span class="qty-value">${qty}</span>
                  <button type="button" class="qty-btn" onclick="updateQty(${index}, 1)">+</button>
                </div>
                <button type="button" class="btn-remove" onclick="removeItem(${index})">Remove</button>
              </div>
            </div>
          </div>
        `;
      });

      container.innerHTML = `
        <div class="cart-layout">
          <div class="cart-items-container">
            ${itemsHTML}
          </div>
          <div class="order-summary">
            <h2>Order Summary</h2>
            <div class="summary-row">
              <span>Subtotal</span>
              <span>$${subtotal.toFixed(2)}</span>
            </div>
            <div class="summary-row">
              <span>Shipping & Taxes</span>
              <span>Calculated at checkout</span>
            </div>
            <div class="summary-row total">
              <span>Total</span>
              <span>$${subtotal.toFixed(2)}</span>
            </div>
            <a href="checkout.html" class="btn-apple-primary">Proceed to Checkout</a>
          </div>
        </div>
      `;
    }

    function updateQty(index, change) {
      let cart = getCart();
      if (cart[index]) {
        cart[index].quantity = (Number(cart[index].quantity) || 1) + change;
        if (cart[index].quantity <= 0) {
          cart.splice(index, 1);
        }
        saveCart(cart);
      }
    }

    function removeItem(index) {
      let cart = getCart();
      cart.splice(index, 1);
      saveCart(cart);
    }

    function clearEntireCart() {
      localStorage.removeItem('prasun_cart');
      renderCart();
    }

    document.addEventListener('DOMContentLoaded', renderCart);
  </script>
</body>
</html>
