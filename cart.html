<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping Bag — PRASUN SHOP</title>
  <style>
    :root {
      --apple-bg: #f5f5f7;
      --apple-card-bg: #ffffff;
      --apple-text: #1d1d1f;
      --apple-gray: #86868b;
      --apple-border: #d2d2d7;
      --apple-dark: #1d1d1f;
      --apple-dark-hover: #333336;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--apple-card-bg);
      color: var(--apple-text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      margin: 0;
      -webkit-font-smoothing: antialiased;
    }

    .header {
      border-bottom: 1px solid var(--apple-border);
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 100;
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--apple-text);
      font-weight: 600;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--apple-gray);
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--apple-text);
    }

    .cart-icon-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      color: var(--apple-text);
      text-decoration: none;
    }

    .cart-badge {
      position: absolute;
      top: -8px;
      right: -10px;
      background-color: var(--apple-dark);
      color: white;
      font-size: 0.7rem;
      font-weight: 600;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: inline-flex;
      justify-content: center;
      align-items: center;
    }

    .hero {
      text-align: center;
      padding: 3rem 2rem 1rem 2rem;
    }

    .hero h1 {
      font-size: 2.25rem;
      font-weight: 700;
      margin: 0;
    }

    .main-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem;
    }

    .cart-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--apple-bg);
      border: 1px solid var(--apple-border);
      border-radius: 16px;
      padding: 1rem 1.5rem;
      margin-bottom: 1rem;
      gap: 1rem;
    }

    .cart-item-info {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex: 1;
    }

    .cart-item-img {
      width: 70px;
      height: 70px;
      object-fit: contain;
      background: #ffffff;
      border-radius: 8px;
      border: 1px solid var(--apple-border);
      padding: 4px;
    }

    .cart-item-details h4 {
      margin: 0 0 0.25rem 0;
      font-size: 1rem;
      font-weight: 600;
    }

    .cart-item-price {
      color: var(--apple-gray);
      font-size: 0.9rem;
      margin: 0;
    }

    .cart-actions {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.95rem;
    }

    .qty-btn {
      background: #ffffff;
      border: 1px solid var(--apple-border);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .qty-btn:hover {
      border-color: var(--apple-text);
    }

    .btn-remove {
      background: none;
      border: none;
      color: #ff3b30;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .cart-summary {
      background: var(--apple-bg);
      border: 1px solid var(--apple-border);
      border-radius: 16px;
      padding: 2rem;
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1rem;
    }

    .summary-total {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .btn-checkout {
      background-color: var(--apple-dark);
      color: #ffffff;
      border: none;
      padding: 0.85rem 2.5rem;
      border-radius: 980px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-checkout:hover {
      background-color: var(--apple-dark-hover);
    }

    .empty-cart {
      text-align: center;
      padding: 4rem 0;
      color: var(--apple-gray);
      font-size: 1.1rem;
    }

    .footer {
      border-top: 1px solid var(--apple-border);
      background-color: var(--apple-bg);
      padding: 2rem;
      text-align: center;
      color: var(--apple-gray);
      font-size: 0.85rem;
      margin-top: 4rem;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-container">
      <a href="index.html" class="logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
        <span>PRASUN SHOP</span>
      </a>
      <nav class="nav-links">
        <a href="index.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="header-actions">
        <a href="cart.html" class="cart-icon-wrap">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span id="cart-count" class="cart-badge">0</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <h1>Your Shopping Bag</h1>
  </section>

  <!-- Main Cart Container -->
  <main class="main-container" id="cart-container">
    <!-- Populated dynamically via JS -->
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div style="margin-bottom: 1rem; display: flex; justify-content: center; gap: 2rem; flex-wrap: wrap;">
      <a href="privacy.html" style="color: var(--apple-gray); text-decoration: none; font-size: 0.85rem; transition: color 0.2s;">Privacy Policy</a>
      <a href="terms.html" style="color: var(--apple-gray); text-decoration: none; font-size: 0.85rem; transition: color 0.2s;">Terms of Service</a>
      <a href="refund.html" style="color: var(--apple-gray); text-decoration: none; font-size: 0.85rem; transition: color 0.2s;">Refund Policy</a>
      <a href="contact.html" style="color: var(--apple-gray); text-decoration: none; font-size: 0.85rem; transition: color 0.2s;">Contact</a>
    </div>
    <p>&copy; 2026 PRASUN SHOP. All rights reserved.</p>
  </footer>

  <script>
    function getCart() {
      try {
        return JSON.parse(localStorage.getItem('prasun_cart')) || [];
      } catch (e) {
        return [];
      }
    }

    function saveCart(cart) {
      localStorage.setItem('prasun_cart', JSON.stringify(cart));
      renderCart();
    }

    function updateCartBadge() {
      const cart = getCart();
      const totalItems = cart.reduce((sum, item) => sum + (Number(item.quantity) || 1), 0);
      const badge = document.getElementById('cart-count');
      if (badge) badge.textContent = totalItems;
    }

    function changeQuantity(index, delta) {
      let cart = getCart();
      if (cart[index]) {
        cart[index].quantity = (Number(cart[index].quantity) || 1) + delta;
        if (cart[index].quantity <= 0) {
          cart.splice(index, 1);
        }
        saveCart(cart);
      }
    }

    function removeItem(index) {
      let cart = getCart();
      cart.splice(index, 1);
      saveCart(cart);
    }

    function renderCart() {
      const cart = getCart();
      const container = document.getElementById('cart-container');
      updateCartBadge();

      if (cart.length === 0) {
        container.innerHTML = `
          <div class="empty-cart">
            <p>Your shopping bag is empty.</p>
            <a href="index.html" class="btn-checkout" style="display:inline-block; text-decoration:none; margin-top:1rem;">Continue Shopping</a>
          </div>
        `;
        return;
      }

      let html = '';
      let subtotal = 0;

      cart.forEach((item, index) => {
        const priceNum = parseFloat(item.price.replace('$', '')) || 0;
        const qty = Number(item.quantity) || 1;
        subtotal += priceNum * qty;

        html += `
          <div class="cart-item">
            <div class="cart-item-info">
              <img src="${item.image}" alt="${item.title}" class="cart-item-img" />
              <div class="cart-item-details">
                <h4>${item.title}</h4>
                <p class="cart-item-price">${item.price}</p>
              </div>
            </div>
            <div class="cart-actions">
              <div class="qty-controls">
                <button class="qty-btn" onclick="changeQuantity(${index}, -1)">-</button>
                <span>${qty}</span>
                <button class="qty-btn" onclick="changeQuantity(${index}, 1)">+</button>
              </div>
              <button class="btn-remove" onclick="removeItem(${index})">Remove</button>
            </div>
          </div>
        `;
      });

      html += `
        <div class="cart-summary">
          <div class="summary-total">Total: $${subtotal.toFixed(2)}</div>
          <button class="btn-checkout" onclick="alert('Checkout integration ready!')">Proceed to Checkout</button>
        </div>
      `;

      container.innerHTML = html;
    }

    document.addEventListener('DOMContentLoaded', renderCart);
  </script>
</body>
</html>
