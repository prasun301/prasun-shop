<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Review your shopping cart, update quantities, and securely proceed to checkout at Prasun Shop."
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <title>Shopping Cart — Prasun Shop</title>

    <!-- =====================================================================
         STYLESHEET
         ===================================================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- =====================================================================
         CART PAGE FALLBACK STYLES
         These ensure the cart remains usable even if style.css is incomplete.
         ===================================================================== -->

    <style>

        /* =================================================================
           RESET / BASE
           ================================================================= */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f8fafc;
            color: #0f172a;
        }

        button,
        input {
            font: inherit;
        }

        a {
            color: inherit;
        }

        /* =================================================================
           ACCESSIBILITY
           ================================================================= */

        .visually-hidden {
            position: absolute !important;
            width: 1px !important;
            height: 1px !important;
            padding: 0 !important;
            margin: -1px !important;
            overflow: hidden !important;
            clip: rect(0, 0, 0, 0) !important;
            white-space: nowrap !important;
            border: 0 !important;
        }

        :focus-visible {
            outline: 3px solid rgba(37, 99, 235, 0.35);
            outline-offset: 3px;
        }

        /* =================================================================
           HEADER
           ================================================================= */

        .cart-page-header {
            position: sticky;
            top: 0;
            z-index: 100;

            width: 100%;

            background: rgba(255, 255, 255, 0.96);

            border-bottom:
                1px solid #e2e8f0;

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);
        }

        .cart-header-inner {
            width: min(
                1200px,
                calc(100% - 32px)
            );

            min-height: 72px;

            margin: 0 auto;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 24px;
        }

        .cart-logo {
            display: inline-flex;
            align-items: center;

            text-decoration: none;

            color: #0f172a;

            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.02em;

            white-space: nowrap;
        }

        .cart-logo:hover {
            color: #2563eb;
        }

        .cart-nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cart-nav-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 42px;

            padding:
                8px 14px;

            border-radius: 10px;

            text-decoration: none;

            color: #475569;

            font-size: 0.95rem;
            font-weight: 600;

            transition:
                background-color 0.2s ease,
                color 0.2s ease;
        }

        .cart-nav-link:hover {
            background: #eff6ff;
            color: #2563eb;
        }

        .cart-nav-link.active {
            background: #eff6ff;
            color: #2563eb;
        }

        .cart-nav-count {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-width: 22px;
            height: 22px;

            margin-left: 6px;

            padding:
                0 6px;

            border-radius: 999px;

            background: #2563eb;
            color: #fff;

            font-size: 0.75rem;
            font-weight: 700;

            line-height: 1;
        }

        /* =================================================================
           MAIN
           ================================================================= */

        .cart-container {
            width: min(
                1200px,
                calc(100% - 32px)
            );

            margin:
                0 auto;

            padding:
                42px 0 72px;
        }

        .cart-page-heading {
            margin: 0 0 8px;

            color: #0f172a;

            font-size:
                clamp(
                    1.75rem,
                    3vw,
                    2.35rem
                );

            font-weight: 800;

            letter-spacing: -0.03em;
        }

        .cart-page-subtitle {
            margin:
                0 0 30px;

            color: #64748b;

            font-size: 0.98rem;
            line-height: 1.6;
        }

        /* =================================================================
           CART LAYOUT
           ================================================================= */

        .cart-layout {
            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                360px;

            align-items: start;

            gap: 24px;
        }

        .cart-items-section,
        .cart-summary-section {
            background: #fff;

            border:
                1px solid #e2e8f0;

            border-radius: 16px;

            box-shadow:
                0 8px 30px
                rgba(15, 23, 42, 0.05);
        }

        /* =================================================================
           ITEMS SECTION
           ================================================================= */

        .cart-items-section {
            min-width: 0;

            padding:
                22px;
        }

        .cart-items-header {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 16px;

            padding-bottom:
                18px;

            margin-bottom:
                2px;

            border-bottom:
                1px solid #e2e8f0;
        }

        .cart-items-heading {
            margin: 0;

            color: #0f172a;

            font-size: 1.15rem;
            font-weight: 750;
        }

        .cart-items-count {
            color: #64748b;

            font-size: 0.9rem;
            font-weight: 600;

            white-space: nowrap;
        }

        /* =================================================================
           CART ITEMS
           ================================================================= */

        #cart-items {
            min-height: 80px;
        }

        .cart-item {
            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                auto;

            align-items: center;

            gap: 24px;

            padding:
                20px 0;

            border-bottom:
                1px solid #e2e8f0;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-item-product {
            display: flex;

            align-items: center;

            min-width: 0;

            gap: 16px;
        }

        .cart-item-image-link {
            display: block;

            flex: 0 0 auto;

            width: 92px;
            height: 92px;

            overflow: hidden;

            border-radius: 12px;

            background: #f1f5f9;

            border:
                1px solid #e2e8f0;

            text-decoration: none;
        }

        .cart-item-image {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: cover;

            background: #f1f5f9;

            transition:
                transform 0.25s ease;
        }

        .cart-item-image-link:hover
        .cart-item-image {
            transform:
                scale(1.04);
        }

        .cart-item-info {
            min-width: 0;
        }

        .cart-item-category {
            display: block;

            margin-bottom: 5px;

            color: #2563eb;

            font-size: 0.76rem;
            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 0.04em;
        }

        .cart-item-title {
            margin: 0;

            font-size: 1rem;
            line-height: 1.4;
            font-weight: 700;
        }

        .cart-item-title a {
            color: #0f172a;

            text-decoration: none;
        }

        .cart-item-title a:hover {
            color: #2563eb;
        }

        .cart-item-price {
            margin:
                7px 0 0;

            color: #64748b;

            font-size: 0.9rem;
        }

        /* =================================================================
           CONTROLS
           ================================================================= */

        .cart-item-controls {
            display: flex;

            align-items: center;

            justify-content: flex-end;

            gap: 20px;
        }

        .quantity-control {
            display: inline-flex;

            align-items: center;

            height: 42px;

            overflow: hidden;

            border:
                1px solid #cbd5e1;

            border-radius: 10px;

            background: #fff;
        }

        .quantity-control button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            width: 38px;
            height: 40px;

            padding: 0;

            border: 0;

            background: #f8fafc;

            color: #334155;

            font-size: 1.1rem;
            font-weight: 700;

            cursor: pointer;

            transition:
                background-color 0.2s ease,
                color 0.2s ease;
        }

        .quantity-control button:hover {
            background: #eff6ff;
            color: #2563eb;
        }

        .quantity-control button[aria-disabled="true"] {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .quantity-input {
            width: 48px;
            height: 40px;

            padding: 0 4px;

            border: 0;

            border-left:
                1px solid #e2e8f0;

            border-right:
                1px solid #e2e8f0;

            background: #fff;

            color: #0f172a;

            text-align: center;

            font-size: 0.92rem;
            font-weight: 700;

            outline: none;

            -moz-appearance: textfield;
        }

        .quantity-input::-webkit-inner-spin-button,
        .quantity-input::-webkit-outer-spin-button {
            margin: 0;

            -webkit-appearance: none;
        }

        .cart-item-subtotal {
            min-width: 90px;

            display: flex;

            flex-direction: column;

            align-items: flex-end;
        }

        .cart-item-subtotal strong {
            color: #0f172a;

            font-size: 1rem;
            font-weight: 800;
        }

        .cart-remove-button {
            margin-top: 6px;

            padding: 0;

            border: 0;

            background: transparent;

            color: #dc2626;

            font-size: 0.82rem;
            font-weight: 600;

            cursor: pointer;

            text-decoration: none;
        }

        .cart-remove-button:hover {
            color: #991b1b;
            text-decoration: underline;
        }

        /* =================================================================
           EMPTY CART
           ================================================================= */

        .cart-empty {
            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            min-height: 340px;

            padding:
                40px 20px;

            text-align: center;
        }

        .cart-empty-icon {
            display: flex;

            align-items: center;
            justify-content: center;

            width: 76px;
            height: 76px;

            margin-bottom: 18px;

            border-radius: 50%;

            background: #eff6ff;

            color: #2563eb;
        }

        .cart-empty-icon svg {
            width: 40px;
            height: 40px;
        }

        .cart-empty h2 {
            margin:
                0 0 8px;

            color: #0f172a;

            font-size: 1.35rem;
            font-weight: 800;
        }

        .cart-empty p {
            max-width: 480px;

            margin:
                0 auto 22px;

            color: #64748b;

            font-size: 0.95rem;
            line-height: 1.6;
        }

        .continue-button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-height: 44px;

            padding:
                0 20px;

            border-radius: 10px;

            background: #2563eb;

            color: #fff;

            font-size: 0.92rem;
            font-weight: 700;

            text-decoration: none;

            transition:
                background-color 0.2s ease,
                transform 0.2s ease;
        }

        .continue-button:hover {
            background: #1d4ed8;

            transform:
                translateY(-1px);
        }

        /* =================================================================
           SUMMARY
           ================================================================= */

        .cart-summary-section {
            position: sticky;

            top: 96px;

            padding:
                24px;
        }

        .cart-summary-section h2 {
            margin:
                0 0 22px;

            color: #0f172a;

            font-size: 1.2rem;
            font-weight: 800;
        }

        .summary-row {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 20px;

            margin-bottom:
                14px;

            color: #475569;

            font-size: 0.95rem;
        }

        .summary-row strong {
            color: #0f172a;
        }

        .summary-row.total {
            margin-top:
                20px;

            padding-top:
                18px;

            border-top:
                1px solid #e2e8f0;

            color: #0f172a;

            font-size: 1.05rem;
            font-weight: 800;
        }

        #cart-total {
            color: #0f172a;

            font-size: 1.25rem;
            font-weight: 800;
        }

        /* =================================================================
           CHECKOUT
           ================================================================= */

        #checkout-button {
            display: flex;

            align-items: center;
            justify-content: center;

            width: 100%;

            min-height: 48px;

            margin-top:
                22px;

            padding:
                0 18px;

            border: 0;

            border-radius: 10px;

            background: #2563eb;

            color: #fff;

            font-size: 0.95rem;
            font-weight: 750;

            cursor: pointer;

            transition:
                background-color 0.2s ease,
                transform 0.2s ease;
        }

        #checkout-button:hover:not(:disabled) {
            background: #1d4ed8;

            transform:
                translateY(-1px);
        }

        #checkout-button:disabled,
        #checkout-button.disabled {
            background: #cbd5e1;

            color: #64748b;

            cursor: not-allowed;

            transform: none;
        }

        /* =================================================================
           CLEAR CART
           ================================================================= */

        #clear-cart-button {
            width: 100%;

            min-height: 42px;

            margin-top:
                10px;

            padding:
                0 14px;

            border:
                1px solid #fecaca;

            border-radius: 10px;

            background: #fff7f7;

            color: #dc2626;

            font-size: 0.88rem;
            font-weight: 650;

            cursor: pointer;

            transition:
                background-color 0.2s ease,
                border-color 0.2s ease;
        }

        #clear-cart-button:hover:not(:disabled) {
            background: #fef2f2;

            border-color:
                #fca5a5;
        }

        #clear-cart-button:disabled {
            opacity: 0.5;

            cursor: not-allowed;
        }

        /* =================================================================
           SECURITY / NO-JS MESSAGE
           ================================================================= */

        .cart-noscript {
            margin:
                20px auto;

            width: min(
                700px,
                calc(100% - 32px)
            );

            padding:
                16px 18px;

            border:
                1px solid #fed7aa;

            border-radius: 10px;

            background: #fff7ed;

            color: #9a3412;

            line-height: 1.5;
        }

        /* =================================================================
           RESPONSIVE TABLET
           ================================================================= */

        @media (max-width: 900px) {

            .cart-layout {
                grid-template-columns:
                    1fr;
            }

            .cart-summary-section {
                position: static;
            }

        }

        /* =================================================================
           RESPONSIVE MOBILE
           ================================================================= */

        @media (max-width: 640px) {

            .cart-header-inner {
                width:
                    calc(100% - 24px);

                min-height: 64px;

                gap: 10px;
            }

            .cart-logo {
                font-size: 1.05rem;
            }

            .cart-nav-link {
                padding:
                    7px 9px;

                font-size: 0.84rem;
            }

            .cart-container {
                width:
                    calc(100% - 24px);

                padding:
                    28px 0 50px;
            }

            .cart-page-subtitle {
                margin-bottom:
                    22px;
            }

            .cart-items-section,
            .cart-summary-section {
                padding:
                    16px;

                border-radius:
                    14px;
            }

            .cart-items-header {
                padding-bottom:
                    14px;
            }

            .cart-item {
                grid-template-columns:
                    1fr;

                gap:
                    16px;

                padding:
                    18px 0;
            }

            .cart-item-product {
                align-items:
                    flex-start;
            }

            .cart-item-image-link {
                width: 78px;
                height: 78px;
            }

            .cart-item-controls {
                width: 100%;

                justify-content:
                    space-between;

                gap:
                    12px;
            }

            .cart-item-subtotal {
                min-width:
                    auto;

                align-items:
                    flex-end;
            }

            .quantity-control {
                flex-shrink:
                    0;
            }

        }

        /* =================================================================
           VERY SMALL DEVICES
           ================================================================= */

        @media (max-width: 400px) {

            .cart-nav-link:first-child {
                display: none;
            }

            .cart-item-product {
                gap:
                    12px;
            }

            .cart-item-image-link {
                width: 68px;
                height: 68px;
            }

            .cart-item-title {
                font-size:
                    0.92rem;
            }

            .cart-item-price {
                font-size:
                    0.82rem;
            }

            .cart-item-controls {
                align-items:
                    flex-start;

                flex-direction:
                    column;
            }

            .cart-item-subtotal {
                align-items:
                    flex-start;
            }

        }

        /* =================================================================
           REDUCED MOTION
           ================================================================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;

                transition:
                    none !important;

                animation:
                    none !important;
            }

        }

    </style>
</head>

<body>

    <!-- =====================================================================
         ACCESSIBILITY LIVE REGION
         ===================================================================== -->

    <div
        id="cart-live-region"
        class="visually-hidden"
        aria-live="polite"
        aria-atomic="true"
    ></div>


    <!-- =====================================================================
         HEADER
         ===================================================================== -->

    <header
        class="cart-page-header"
        role="banner"
    >

        <div class="cart-header-inner">

            <a
                href="index.html"
                class="cart-logo"
                aria-label="Prasun Shop home"
            >
                Prasun Shop
            </a>

            <nav
                class="cart-nav"
                aria-label="Main navigation"
            >

                <a
                    href="products.html"
                    class="cart-nav-link"
                >
                    Shop
                </a>

                <a
                    href="cart.html"
                    class="cart-nav-link active"
                    aria-current="page"
                >
                    Cart

                    <span
                        id="cart-count"
                        class="cart-nav-count"
                        aria-label="0 items in cart"
                    >
                        0
                    </span>
                </a>

            </nav>

        </div>

    </header>


    <!-- =====================================================================
         MAIN CONTENT
         ===================================================================== -->

    <main
        class="cart-container"
        id="main-content"
    >

        <h1 class="cart-page-heading">
            Shopping Cart
        </h1>

        <p class="cart-page-subtitle">
            Review your items, update quantities, and proceed to checkout.
        </p>


        <div class="cart-layout">

            <!-- =============================================================
                 CART ITEMS
                 ============================================================= -->

            <section
                class="cart-items-section"
                aria-labelledby="cart-items-heading"
            >

                <div class="cart-items-header">

                    <h2
                        id="cart-items-heading"
                        class="cart-items-heading"
                    >
                        Your Items
                    </h2>

                    <span
                        id="cart-items-count"
                        class="cart-items-count"
                    >
                        0 items
                    </span>

                </div>


                <!--
                    IMPORTANT:
                    Do NOT put "Loading..." here.

                    cart.js controls this container and will render:
                    - cart products
                    - or the empty-cart interface
                -->

                <div
                    id="cart-items"
                    aria-live="polite"
                    aria-busy="false"
                >
                    <div class="cart-empty">
                        <div
                            class="cart-empty-icon"
                            aria-hidden="true"
                        >
                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.7"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path d="M6 8h12l1 13H5L6 8Z"></path>
                                <path d="M9 8V6a3 3 0 0 1 6 0v2"></path>
                            </svg>
                        </div>

                        <h2>
                            Your cart is empty
                        </h2>

                        <p>
                            Add products from our shop to see them here.
                        </p>

                        <a
                            href="products.html"
                            class="continue-button"
                        >
                            Continue Shopping
                        </a>
                    </div>
                </div>

            </section>


            <!-- =============================================================
                 ORDER SUMMARY
                 ============================================================= -->

            <aside
                class="cart-summary-section"
                aria-labelledby="cart-summary-heading"
            >

                <h2 id="cart-summary-heading">
                    Order Summary
                </h2>


                <div class="summary-row">

                    <span>
                        Items
                    </span>

                    <strong id="summary-item-count">
                        0
                    </strong>

                </div>


                <div class="summary-row">

                    <span>
                        Subtotal
                    </span>

                    <strong id="cart-subtotal">
                        $0.00
                    </strong>

                </div>


                <div class="summary-row total">

                    <span>
                        Total
                    </span>

                    <strong id="cart-total">
                        $0.00
                    </strong>

                </div>


                <button
                    type="button"
                    id="checkout-button"
                    disabled
                    aria-disabled="true"
                >
                    Proceed to Checkout
                </button>


                <button
                    type="button"
                    id="clear-cart-button"
                    disabled
                >
                    Clear Cart
                </button>

            </aside>

        </div>

    </main>


    <!-- =====================================================================
         NO JAVASCRIPT MESSAGE
         ===================================================================== -->

    <noscript>

        <div class="cart-noscript">
            JavaScript is required to manage your shopping cart.
            Please enable JavaScript in your browser and reload this page.
        </div>

    </noscript>


    <!-- =====================================================================
         CART JAVASCRIPT
         ===================================================================== -->

    <script
        src="cart.js"
        defer
    ></script>


    <!-- =====================================================================
         SMALL COMPATIBILITY SCRIPT
         Keeps the summary item count synchronized with the cart.
         ===================================================================== -->

    <script>
        document.addEventListener("DOMContentLoaded", () => {

            function syncSummaryCount() {

                const count =
                    document.getElementById(
                        "cart-items-count"
                    );

                const summary =
                    document.getElementById(
                        "summary-item-count"
                    );

                if (!count || !summary) {
                    return;
                }

                const text =
                    count.textContent
                        .trim();

                const match =
                    text.match(/\d+/);

                summary.textContent =
                    match
                        ? match[0]
                        : "0";
            }

            syncSummaryCount();

            window.addEventListener(
                "prasunCartUpdated",
                syncSummaryCount
            );

            window.addEventListener(
                "cartUpdated",
                syncSummaryCount
            );

        });
    </script>

</body>
</html>
