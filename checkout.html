<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | Prasun Shop</title>

<meta name="description" content="Complete your purchase at Prasun Shop.">

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<!-- Header -->

<header>


<div class="container nav">


<div class="logo">

Prasun Shop

</div>




<nav>


<a href="index.html">
Home
</a>


<a href="products.html">
Products
</a>


<a href="cart.html">
Cart
</a>



<a href="cart.html" class="cart-icon">

🛒

<span id="cart-count">
0
</span>

</a>



</nav>


</div>


</header>







<!-- Checkout Section -->


<section class="products">


<div class="container">



<h2>

Checkout

</h2>




<!-- Order Summary -->


<div class="checkout-box">


<h3>

Order Summary

</h3>



<div id="order-summary">

</div>



</div>








<!-- Customer Information -->


<div class="checkout-box">


<h3>

Customer Information

</h3>




<form id="checkout-form" class="checkout-form">


<div class="form-group">

<label>
👤 Full Name
</label>

<input 
type="text"
id="name"
placeholder="Enter your full name"
required
>

</div>



<div class="form-group">

<label>
📧 Email Address
</label>

<input 
type="email"
id="email"
placeholder="Enter your email"
required
>

</div>




<div class="form-group">

<label>
📱 Phone Number
</label>


<input 
type="tel"
id="phone"
placeholder="Enter your phone number"
required
>


</div>





<div class="form-group">

<label>
🏠 Shipping Address
</label>


<textarea

id="address"

placeholder="Enter complete delivery address"

required

></textarea>


</div>




<button 
type="submit"
class="checkout-btn"
>

Place Order

</button>


</form>



</div>



</div>


</section>







<!-- JavaScript -->


<script src="js/cart-count.js"></script>

<script src="js/checkout.js"></script>



</body>


</html>
