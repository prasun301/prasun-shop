<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | Prasun Shop</title>

<meta name="description" content="Complete your purchase at Prasun Shop.">

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<!-- Header -->

<header>


<div class="container nav">


<div class="logo">

Prasun Shop

</div>




<nav>


<a href="index.html">
Home
</a>


<a href="products.html">
Products
</a>


<a href="cart.html">
Cart
</a>



<a href="cart.html" class="cart-icon">

🛒

<span id="cart-count">
0
</span>

</a>



</nav>


</div>


</header>







<!-- Checkout Section -->


<section class="products">


<div class="container">



<h2>

Checkout

</h2>




<!-- Order Summary -->


<div class="checkout-box">


<h3>

Order Summary

</h3>



<div id="order-summary">

Loading order...

</div>



</div>








<!-- Customer Information -->


<div class="checkout-box">


<h3>

Customer Information

</h3>




<form id="checkout-form">



<input

type="text"

id="name"

placeholder="Full Name"

required

>




<input

type="email"

id="email"

placeholder="Email Address"

required

>




<input

type="tel"

id="phone"

placeholder="Phone Number"

required

>




<textarea

id="address"

placeholder="Shipping Address"

required

></textarea>





<button type="submit">

Place Order

</button>




</form>



</div>



</div>


</section>







<!-- JavaScript -->


<script src="js/cart-count.js"></script>

<script src="js/checkout.js"></script>



</body>


</html>
