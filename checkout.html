<script>
    const countries = [
      "United States", "Afghanistan", "Albania", "Algeria", "Andorra", "Angola", "Antigua and Barbuda", "Argentina", "Armenia", "Australia", "Austria", "Azerbaijan", "Bahamas", "Bahrain", "Bangladesh", "Barbados", "Belarus", "Belgium", "Belize", "Benin", "Bhutan", "Bolivia", "Bosnia and Herzegovina", "Botswana", "Brazil", "Brunei", "Bulgaria", "Burkina Faso", "Burundi", "Cabo Verde", "Cambodia", "Cameroon", "Canada", "Central African Republic", "Chad", "Chile", "China", "Colombia", "Comoros", "Congo", "Costa Rica", "Croatia", "Cuba", "Cyprus", "Czechia", "Denmark", "Djibouti", "Dominica", "Dominican Republic", "Ecuador", "Egypt", "El Salvador", "Equatorial Guinea", "Eritrea", "Estonia", "Eswatini", "Ethiopia", "Fiji", "Finland", "France", "Gabon", "Gambia", "Georgia", "Germany", "Ghana", "Greece", "Grenada", "Guatemala", "Guinea", "Guinea-Bissau", "Guyana", "Haiti", "Honduras", "Hungary", "Iceland", "India", "Indonesia", "Iran", "Iraq", "Ireland", "Israel", "Italy", "Jamaica", "Japan", "Jordan", "Kazakhstan", "Kenya", "Kiribati", "Kuwait", "Kyrgyzstan", "Laos", "Latvia", "Lebanon", "Lesotho", "Liberia", "Libya", "Liechtenstein", "Lithuania", "Luxembourg", "Madagascar", "Malawi", "Malaysia", "Maldives", "Mali", "Malta", "Marshall Islands", "Mauritania", "Mauritius", "Mexico", "Micronesia", "Moldova", "Monaco", "Mongolia", "Montenegro", "Morocco", "Mozambique", "Myanmar", "Namibia", "Nauru", "Nepal", "Netherlands", "New Zealand", "Nicaragua", "Niger", "Nigeria", "North Korea", "North Macedonia", "Norway", "Oman", "Pakistan", "Palau", "Panama", "Papua New Guinea", "Paraguay", "Peru", "Philippines", "Poland", "Portugal", "Qatar", "Romania", "Russia", "Rwanda", "Saint Kitts and Nevis", "Saint Lucia", "Saint Vincent and the Grenadines", "Samoa", "San Marino", "Sao Tome and Principe", "Saudi Arabia", "Senegal", "Serbia", "Seychelles", "Sierra Leone", "Singapore", "Slovakia", "Slovenia", "Solomon Islands", "Somalia", "South Africa", "South Korea", "South Sudan", "Spain", "Sri Lanka", "Sudan", "Suriname", "Sweden", "Switzerland", "Syria", "Taiwan", "Tajikistan", "Tanzania", "Thailand", "Togo", "Tonga", "Trinidad and Tobago", "Tunisia", "Turkey", "Turkmenistan", "Tuvalu", "Uganda", "Ukraine", "United Arab Emirates", "United Kingdom", "Uruguay", "Uzbekistan", "Vanuatu", "Vatican City", "Venezuela", "Vietnam", "Yemen", "Zambia", "Zimbabwe"
    ];

    function initCustomDropdown() {
      const dropdown = document.getElementById('country-dropdown');
      const selectedText = document.getElementById('dropdown-selected-text');
      const listContainer = document.getElementById('dropdown-list');
      const searchInput = document.getElementById('country-search');
      const optionsList = document.getElementById('dropdown-options-list');
      const hiddenInput = document.getElementById('country-input');

      function renderOptions(filter = '') {
        optionsList.innerHTML = '';
        const filtered = countries.filter(c => c.toLowerCase().includes(filter.toLowerCase()));
        
        if (filtered.length === 0) {
          optionsList.innerHTML = `<div style="padding: 10px; color: var(--apple-gray); text-align: center;">No country found</div>`;
          return;
        }

        filtered.forEach(country => {
          const div = document.createElement('div');
          div.className = 'dropdown-option';
          if (country === hiddenInput.value) div.classList.add('selected');
          div.textContent = country;
          div.addEventListener('click', (e) => {
            e.stopPropagation();
            selectedText.textContent = country;
            hiddenInput.value = country;
            listContainer.classList.remove('open');
            selectedText.classList.remove('active');
          });
          optionsList.appendChild(div);
        });
      }

      selectedText.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = listContainer.classList.toggle('open');
        selectedText.classList.toggle('active', isOpen);
        if (isOpen) {
          searchInput.value = '';
          renderOptions();
          setTimeout(() => searchInput.focus(), 50);
        }
      });

      searchInput.addEventListener('input', (e) => {
        renderOptions(e.target.value);
      });

      searchInput.addEventListener('click', (e) => {
        e.stopPropagation();
      });

      document.addEventListener('click', () => {
        listContainer.classList.remove('open');
        selectedText.classList.remove('active');
      });

      renderOptions();
    }

    function updateCartBadge() {
      try {
        const cart = JSON.parse(localStorage.getItem('prasun_cart')) || [];
        const totalItems = cart.reduce((sum, item) => sum + (Number(item.quantity) || 1), 0);
        const badge = document.getElementById('cart-count');
        if (badge) badge.textContent = totalItems;
      } catch (e) {
        console.error(e);
      }
    }

    function renderCheckoutSummary() {
      updateCartBadge();
      let cart = [];
      try {
        cart = JSON.parse(localStorage.getItem('prasun_cart')) || [];
      } catch (e) {
        cart = [];
      }

      const container = document.getElementById('summary-items-container');

      if (cart.length === 0) {
        container.innerHTML = `
          <div class="empty-cart-msg">Your bag is empty.</div>
          <div class="summary-row"><span>Subtotal</span><span>$0.00</span></div>
          <div class="summary-row"><span>Shipping</span><span>$0.00</span></div>
          <div class="summary-total"><span>Total</span><span>$0.00</span></div>
          <button class="btn-place-order" id="btn-place-order">Return to Shop</button>
        `;
        document.getElementById('btn-place-order').addEventListener('click', () => {
          window.location.href = 'index.html';
        });
        return;
      }

      let itemsHTML = '';
      let subtotal = 0;

      cart.forEach(item => {
        const priceNum = parseFloat(item.price.replace('$', '')) || 0;
        const qty = Number(item.quantity) || 1;
        subtotal += priceNum * qty;

        itemsHTML += `
          <div class="summary-item">
            <img src="${item.image}" alt="${item.title}" />
            <div class="summary-details">
              <h4>${item.title}</h4>
              <p>Qty: ${qty}</p>
            </div>
            <div style="margin-left: auto; font-weight: 600; font-size: 0.95rem;">$${(priceNum * qty).toFixed(2)}</div>
          </div>
        `;
      });

      const shipping = 5.00;
      const total = subtotal + shipping;

      container.innerHTML = `
        ${itemsHTML}
        <div class="summary-row"><span>Subtotal</span><span>$${subtotal.toFixed(2)}</span></div>
        <div class="summary-row"><span>Shipping</span><span>$${shipping.toFixed(2)}</span></div>
        <div class="summary-total"><span>Total</span><span>$${total.toFixed(2)}</span></div>
        <button class="btn-place-order" id="btn-place-order">Place Order</button>
      `;

      // Clean event listener attached securely after rendering
      document.getElementById('btn-place-order').addEventListener('click', () => {
        localStorage.removeItem('prasun_cart');
        window.location.href = 'order-success.html';
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderCheckoutSummary();
      initCustomDropdown();
    });
  </script>
