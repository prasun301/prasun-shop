<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — PRASUN SHOP</title>
  <style>
    :root {
      --apple-bg: #f5f5f7;
      --apple-card-bg: #ffffff;
      --apple-text: #1d1d1f;
      --apple-gray: #86868b;
      --apple-border: #d2d2d7;
      --apple-dark: #1d1d1f;
      --apple-dark-hover: #333336;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--apple-card-bg);
      color: var(--apple-text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      margin: 0;
      -webkit-font-smoothing: antialiased;
    }

    button:focus, input:focus {
      outline: none !important;
    }

    .header {
      border-bottom: 1px solid var(--apple-border);
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 100;
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--apple-text);
      font-weight: 600;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--apple-gray);
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    .nav-links a:hover, .nav-links a.active {
      color: var(--apple-text);
    }

    .hero {
      text-align: center;
      padding: 4rem 2rem 2rem 2rem;
    }

    .hero h1 {
      font-size: 2.75rem;
      font-weight: 700;
      margin: 0 0 0.5rem 0;
      letter-spacing: -0.015em;
    }

    .hero p {
      color: var(--apple-gray);
      font-size: 1.1rem;
      margin: 0;
    }

    .main-container {
      max-width: 700px;
      margin: 0 auto;
      padding: 2rem 2rem 4rem 2rem;
    }

    .contact-card {
      background-color: var(--apple-bg);
      border: 1px solid var(--apple-border);
      border-radius: 20px;
      padding: 2.5rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-label {
      display: block;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: var(--apple-text);
    }

    .form-input, .form-textarea {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 1px solid var(--apple-border);
      border-radius: 12px;
      background-color: #ffffff;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--apple-text);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input:focus, .form-textarea:focus {
      border-color: var(--apple-dark);
      box-shadow: 0 0 0 3px rgba(29, 29, 31, 0.1);
    }

    .form-textarea {
      resize: vertical;
      min-height: 140px;
    }

    .btn-submit {
      display: block;
      width: 100%;
      background-color: var(--apple-dark);
      color: #ffffff;
      text-align: center;
      padding: 0.9rem;
      border-radius: 980px;
      border: none;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: var(--apple-dark-hover);
    }

    .direct-contact {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.95rem;
      color: var(--apple-gray);
    }

    .direct-contact a {
      color: var(--apple-text);
      text-decoration: none;
      font-weight: 600;
    }

    .footer {
      border-top: 1px solid var(--apple-border);
      background-color: var(--apple-bg);
      padding: 2rem;
      text-align: center;
      color: var(--apple-gray);
      font-size: 0.85rem;
      margin-top: 4rem;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-container">
      <a href="index.html" class="logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
        <span>PRASUN SHOP</span>
      </a>
      <nav class="nav-links">
        <a href="index.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <h1>Get in Touch</h1>
    <p>Have questions about an ebook or need assistance with your download?</p>
  </section>

  <!-- Main Content -->
  <main class="main-container">
    <div class="contact-card">
      <form action="https://formsubmit.co/contact@prasunbarua.com" method="POST">
        <input type="hidden" name="_captcha" value="false">
        
        <div class="form-group">
          <label class="form-label" for="name">Your Name</label>
          <input type="text" id="name" name="name" class="form-input" placeholder="John Doe" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-input" placeholder="john@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="message">Message</label>
          <textarea id="message" name="message" class="form-textarea" placeholder="How can we help you?" required></textarea>
        </div>

        <button type="submit" class="btn-submit">Send Message</button>
      </form>
    </div>

    <div class="direct-contact">
      Prefer to email directly? Reach us at <a href="mailto:contact@prasunbarua.com">contact@prasunbarua.com</a>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div style="margin-bottom: 1rem; display: flex; justify-content: center; gap: 2rem; flex-wrap: wrap;">
      <a href="privacy.html" style="color: var(--apple-gray); text-decoration: none; font-size: 0.85rem; transition: color 0.2s;">Privacy Policy</a>
      <a href="terms.html" style="color: var(--apple-gray); text-decoration: none; font-size: 0.85rem; transition: color 0.2s;">Terms of Service</a>
      <a href="refund.html" style="color: var(--apple-gray); text-decoration: none; font-size: 0.85rem; transition: color 0.2s;">Refund Policy</a>
      <a href="contact.html" style="color: var(--apple-gray); text-decoration: none; font-size: 0.85rem; transition: color 0.2s;">Contact</a>
    </div>
    <p>&copy; 2026 PRASUN SHOP. All rights reserved.</p>
  </footer>

</body>
</html>
