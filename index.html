<!DOCTYPE html>
<html>
<head>
    <title>Prasun Shop | Online Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        header {
            background: #111;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .hero {
            padding: 50px 20px;
            text-align: center;
            background: white;
        }

        .hero h1 {
            font-size: 40px;
        }

        .products {
            display: flex;
            gap: 20px;
            justify-content: center;
            padding: 30px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            width: 280px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        button {
            background: black;
            color: white;
            padding: 12px 25px;
            border: none;
            cursor: pointer;
        }

        footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>

</head>

<body>

<header>
    <h1>Prasun Shop</h1>
    <p>Smart Products. Reliable Service.</p>
</header>


<section class="hero">

<h1>Welcome to Prasun Shop</h1>

<p>
Discover quality products selected for modern lifestyles.
</p>

<button>
Shop Now
</button>

</section>


<section class="products">

<div class="card">

<h2>Product 1</h2>

<p>
Premium product description
</p>

<h3>$29.99</h3>

<button>
Buy Now
</button>

</div>


<div class="card">

<h2>Product 2</h2>

<p>
Premium product description
</p>

<h3>$39.99</h3>

<button>
Buy Now
</button>

</div>


</section>


<footer>

<p>
© 2026 Prasun Shop
</p>

</footer>


</body>
</html>
