<!DOCTYPE html>
<html lang="en">
<head>

  <!-- =====================================================

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>PRASUN SHOP — Physical Products</title>

  <meta
    name="description"
    content="Shop quality physical products from PRASUN SHOP."
  >


  <!-- =====================================================
       FAVICON
       ===================================================== -->

  <link
    rel="icon"
    href="favicon.ico"
    sizes="any"
  >

  <link
    rel="icon"
    href="icon.svg"
    type="image/svg+xml"
  >

  <link
    rel="apple-touch-icon"
    href="apple-touch-icon.png"
  >


  <!-- =====================================================
       GOOGLE ADSENSE
       ===================================================== -->

  <script
    async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8736637194399168"
    crossorigin="anonymous">
  </script>


  <!-- =====================================================
       STYLES
       ===================================================== -->

  <style>

    /* =====================================================
       STORE VARIABLES
       ===================================================== */

    .store-container {

      --store-text: #334155;
      --store-heading: #0f172a;
      --store-subtext: #64748b;

      --store-divider: #e2e8f0;

      --store-card-bg: #ffffff;
      --store-card-border: #e2e8f0;

      --store-image-bg: #f8fafc;

      --store-card-shadow:
        0 4px 6px -1px rgba(0,0,0,.05),
        0 2px 4px -2px rgba(0,0,0,.05);

      --store-card-hover-shadow:
        0 20px 25px -5px rgba(0,0,0,.08),
        0 8px 10px -6px rgba(0,0,0,.04);

      --store-price: #b12704;

      --store-btn-bg: #ffd814;
      --store-btn-text: #0f172a;
      --store-btn-hover: #f7ca00;
      --store-btn-active: #f0b800;
      --store-btn-border: #f2c200;

      --store-focus-ring: #2563eb;
    }


    /* =====================================================
       DARK MODE
       ===================================================== */

    @media (prefers-color-scheme: dark) {

      .store-container {

        --store-text: #cbd5e1;
        --store-heading: #f8fafc;
        --store-subtext: #94a3b8;

        --store-divider: #334155;

        --store-card-bg: #1e293b;
        --store-card-border: #334155;

        --store-image-bg: #0f172a;

        --store-card-shadow:
          0 4px 6px -1px rgba(0,0,0,.3),
          0 2px 4px -2px rgba(0,0,0,.2);

        --store-card-hover-shadow:
          0 20px 25px -5px rgba(0,0,0,.45),
          0 8px 10px -6px rgba(0,0,0,.3);

        --store-price: #ffa41c;

        --store-btn-bg: #f7c948;
        --store-btn-text: #0f172a;
        --store-btn-hover: #f0b829;
        --store-btn-active: #e2a81a;
        --store-btn-border: #c89512;

        --store-focus-ring: #38bdf8;
      }
    }


    /* =====================================================
       RESET
       ===================================================== */

    * {

      box-sizing: border-box;

      margin: 0;

      padding: 0;
    }


    /* =====================================================
       BODY
       ===================================================== */

    body {

      background-color: #f8fafc;

      color: #334155;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      line-height: 1.5;

      -webkit-font-smoothing: antialiased;
    }


    /* =====================================================
       HEADER
       ===================================================== */

    .header {

      border-bottom:
        1px solid #e2e8f0;

      position: sticky;

      top: 0;

      background:
        rgba(255,255,255,.95);

      backdrop-filter:
        blur(12px);

      -webkit-backdrop-filter:
        blur(12px);

      z-index: 100;
    }


    .header-container {

      max-width: 1080px;

      margin: 0 auto;

      display: flex;

      justify-content: space-between;

      align-items: center;

      padding: 1rem 1.5rem;
    }


    .logo {

      display: flex;

      align-items: center;

      gap: 10px;

      text-decoration: none;

      color: #0f172a;

      font-weight: 700;

      font-size: 1.15rem;

      letter-spacing: -.01em;
    }


    .nav-links {

      display: flex;

      align-items: center;

      gap: 2rem;
    }


    .nav-links a {

      text-decoration: none;

      color: #64748b;

      font-size: .95rem;

      font-weight: 500;

      transition:
        color .2s ease;
    }


    .nav-links a:hover,
    .nav-links a.active {

      color: #0f172a;

      font-weight: 600;
    }


    /* =====================================================
       CART
       ===================================================== */

    .cart-link {

      position: relative;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      text-decoration: none;

      color: #64748b;
    }


    .cart-link:hover {

      color: #0f172a;
    }


    .cart-icon {

      width: 21px;

      height: 21px;
    }


    .cart-count {

      position: absolute;

      top: -8px;

      right: -10px;

      min-width: 18px;

      height: 18px;

      padding: 0 5px;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      border-radius: 9999px;

      background: #dc2626;

      color: #ffffff;

      font-size: 10px;

      font-weight: 700;

      line-height: 1;

      border: 2px solid #ffffff;
    }


    /* =====================================================
       MAIN STORE
       ===================================================== */

    .store-container {

      max-width: 1080px;

      margin: 20px auto 40px;

      padding: 24px;

      color: var(--store-text);
    }


    .store-title {

      color:
        var(--store-heading);

      font-size: 2rem;

      font-weight: 800;

      margin-bottom: 8px;

      letter-spacing: -.02em;
    }


    .store-subtitle {

      color:
        var(--store-subtext);

      font-size: 1.05rem;

      margin-bottom: 28px;
    }


    /* =====================================================
       STORE CONTROLS
       ===================================================== */

    .products-toolbar {

      display: flex;

      flex-wrap: wrap;

      gap: 12px;

      align-items: center;

      margin-bottom: 20px;
    }


    .products-search {

      position: relative;

      flex: 1 1 320px;
    }


    .products-search-input {

      width: 100%;

      height: 44px;

      padding:
        0 44px 0 14px;

      border:
        1px solid #cbd5e1;

      border-radius: 8px;

      background: #ffffff;

      color: #0f172a;

      font-family: inherit;

      font-size: 14px;

      outline: none;

      transition:
        border-color .2s ease,
        box-shadow .2s ease;
    }


    .products-search-input:focus {

      border-color:
        var(--store-focus-ring);

      box-shadow:
        0 0 0 3px rgba(37,99,235,.12);
    }


    .search-clear {

      position: absolute;

      top: 50%;

      right: 10px;

      transform: translateY(-50%);

      border: 0;

      background: transparent;

      color: #64748b;

      cursor: pointer;

      font-size: 18px;

      line-height: 1;

      padding: 5px;
    }


    .products-sort {

      height: 44px;

      padding:
        0 34px 0 12px;

      border:
        1px solid #cbd5e1;

      border-radius: 8px;

      background: #ffffff;

      color: #334155;

      font-family: inherit;

      font-size: 14px;

      cursor: pointer;

      outline: none;
    }


    .products-sort:focus {

      border-color:
        var(--store-focus-ring);

      box-shadow:
        0 0 0 3px rgba(37,99,235,.12);
    }


    /* =====================================================
       CATEGORIES
       ===================================================== */

    .products-categories {

      display: flex;

      flex-wrap: wrap;

      gap: 8px;

      margin-bottom: 20px;
    }


    .category-pill {

      border:
        1px solid #cbd5e1;

      background: #ffffff;

      color: #475569;

      border-radius: 9999px;

      padding:
        7px 14px;

      font-family: inherit;

      font-size: 13px;

      font-weight: 600;

      cursor: pointer;

      transition:
        background-color .15s ease,
        color .15s ease,
        border-color .15s ease;
    }


    .category-pill:hover {

      border-color: #94a3b8;

      color: #0f172a;
    }


    .category-pill.active {

      background: #0f172a;

      border-color: #0f172a;

      color: #ffffff;
    }


    /* =====================================================
       RESULTS BAR
       ===================================================== */

    .products-results-bar {

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 12px;

      margin-bottom: 18px;
    }


    .products-heading {

      color:
        var(--store-heading);

      font-size: 1.15rem;

      font-weight: 700;
    }


    .products-result-count {

      color:
        var(--store-subtext);

      font-size: 13px;
    }


    /* =====================================================
       PRODUCT GRID
       ===================================================== */

    .product-grid {

      display: grid;

      grid-template-columns:
        repeat(auto-fill, minmax(230px, 1fr));

      gap: 24px;

      margin-bottom: 48px;
    }


    /* =====================================================
       PRODUCT CARD
       ===================================================== */

    .product-card {

      background-color:
        var(--store-card-bg);

      border:
        1px solid var(--store-card-border);

      border-radius: 12px;

      overflow: hidden;

      box-shadow:
        var(--store-card-shadow);

      transition:
        transform .2s ease,
        box-shadow .2s ease;
    }


    .product-card:hover {

      transform:
        translateY(-4px);

      box-shadow:
        var(--store-card-hover-shadow);
    }


    .product-card-inner {

      height: 100%;

      display: flex;

      flex-direction: column;
    }


    .product-card-link {

      display: flex;

      flex-direction: column;

      flex-grow: 1;

      text-decoration: none;

      color: inherit;
    }


    /* =====================================================
       PRODUCT IMAGE
       ===================================================== */

    .product-card-image {

      position: relative;

      width: 100%;

      aspect-ratio: 1 / 1;

      display: flex;

      align-items: center;

      justify-content: center;

      overflow: hidden;

      background:
        var(--store-image-bg);

      border-bottom:
        1px solid var(--store-card-border);
    }


    .product-card-image img {

      width: 100%;

      height: 100%;

      object-fit: contain;

      padding: 12px;

      transition:
        transform .3s ease;
    }


    .product-card:hover
    .product-card-image img {

      transform:
        scale(1.04);
    }


    .product-category {

      position: absolute;

      top: 10px;

      left: 10px;

      background:
        rgba(15,23,42,.88);

      color: #ffffff;

      border-radius: 9999px;

      padding:
        4px 9px;

      font-size: 10px;

      font-weight: 700;

      line-height: 1.2;
    }


    /* =====================================================
       PRODUCT BODY
       ===================================================== */

    .product-card-body {

      padding: 16px;

      display: flex;

      flex-direction: column;

      flex-grow: 1;
    }


    .product-meta {

      margin-bottom: 5px;
    }


    .product-rating {

      color: #b45309;

      font-size: 12px;

      font-weight: 700;
    }


    .product-title {

      color:
        var(--store-heading);

      font-size: 16px;

      font-weight: 700;

      line-height: 1.35;

      margin-bottom: 7px;

      display: -webkit-box;

      -webkit-line-clamp: 2;

      -webkit-box-orient: vertical;

      overflow: hidden;
    }


    .product-description {

      color:
        var(--store-subtext);

      font-size: 13px;

      line-height: 1.45;

      margin-bottom: 12px;

      display: -webkit-box;

      -webkit-line-clamp: 3;

      -webkit-box-orient: vertical;

      overflow: hidden;
    }


    .product-price {

      color:
        var(--store-price);

      font-size: 21px;

      font-weight: 700;

      line-height: 1.2;

      margin-top: auto;
    }


    /* =====================================================
       PRODUCT ACTIONS
       ===================================================== */

    .product-card-actions {

      padding:
        0 16px 16px;
    }


    .btn-add-to-cart {

      width: 100%;

      border:
        1px solid var(--store-btn-border);

      border-radius: 9999px;

      background:
        var(--store-btn-bg);

      color:
        var(--store-btn-text);

      font-family: inherit;

      font-size: 14px;

      font-weight: 600;

      padding: 10px 0;

      cursor: pointer;

      box-shadow:
        0 1px 2px rgba(0,0,0,.05);

      transition:
        background-color .15s ease,
        transform .08s ease;
    }


    .btn-add-to-cart:hover {

      background:
        var(--store-btn-hover);
    }


    .btn-add-to-cart:active {

      background:
        var(--store-btn-active);

      transform:
        scale(.98);
    }


    .btn-add-to-cart:focus-visible {

      outline:
        3px solid var(--store-focus-ring);

      outline-offset: 3px;
    }


    /* =====================================================
       EMPTY / ERROR STATES
       ===================================================== */

    .products-empty,
    .products-error {

      grid-column:
        1 / -1;

      text-align: center;

      padding:
        60px 20px;
    }


    .products-empty-icon {

      width: 48px;

      height: 48px;

      margin:
        0 auto 16px;

      color: #94a3b8;
    }


    .products-empty-icon svg {

      width: 100%;

      height: 100%;
    }


    .products-empty h2,
    .products-error h2 {

      color:
        var(--store-heading);

      font-size: 1.25rem;

      margin-bottom: 8px;
    }


    .products-empty p,
    .products-error p {

      color:
        var(--store-subtext);

      font-size: 14px;

      margin-bottom: 18px;
    }


    .products-empty-button {

      border: 0;

      border-radius: 9999px;

      background: #0f172a;

      color: #ffffff;

      padding:
        9px 18px;

      font-family: inherit;

      font-size: 13px;

      font-weight: 600;

      cursor: pointer;
    }


    /* =====================================================
       VISUALLY HIDDEN
       ===================================================== */

    .visually-hidden {

      position: absolute !important;

      width: 1px !important;

      height: 1px !important;

      padding: 0 !important;

      margin: -1px !important;

      overflow: hidden !important;

      clip: rect(0,0,0,0) !important;

      white-space: nowrap !important;

      border: 0 !important;
    }


    /* =====================================================
       FOOTER
       ===================================================== */

    .footer {

      border-top:
        1px solid #e2e8f0;

      background-color:
        #ffffff;

      padding:
        2.5rem 1.5rem;

      text-align: center;

      color:
        #64748b;

      font-size: .875rem;

      margin-top: 3rem;
    }


    .footer-links {

      display: flex;

      flex-wrap: wrap;

      justify-content: center;

      gap: 1.5rem;

      margin-bottom: 1rem;
    }


    .footer-links a {

      color:
        #64748b;

      text-decoration: none;

      font-weight: 500;

      transition:
        color .2s ease;
    }


    .footer-links a:hover {

      color:
        #0f172a;

      text-decoration:
        underline;
    }


    .footer p a {

      color:
        #334155;

      text-decoration:
        underline;

      font-weight: 500;
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 640px) {

      .header-container {

        padding:
          .85rem 1rem;
      }


      .nav-links {

        gap: 1rem;
      }


      .nav-links a {

        font-size: .85rem;
      }


      .store-container {

        padding: 16px;

        margin:
          16px auto;
      }


      .store-title {

        font-size: 1.7rem;
      }


      .store-subtitle {

        font-size: .95rem;
      }


      .products-toolbar {

        align-items: stretch;
      }


      .products-search {

        flex-basis: 100%;
      }


      .products-sort {

        width: 100%;
      }


      .product-grid {

        gap: 16px;

        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }


      .product-card-body {

        padding: 12px;
      }


      .product-card-actions {

        padding:
          0 12px 12px;
      }


      .product-title {

        font-size: 14px;
      }


      .product-description {

        font-size: 12px;

        -webkit-line-clamp: 2;
      }


      .product-price {

        font-size: 18px;
      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       HEADER
       ===================================================== -->

  <header class="header">

    <div class="header-container">

      <a
        href="index.html"
        class="logo"
        aria-label="PRASUN SHOP Homepage">

        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round">

          <path
            d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20">
          </path>

          <path
            d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z">
          </path>

        </svg>

        <span>PRASUN SHOP</span>

      </a>


      <nav class="nav-links">

        <a
          href="index.html"
          class="active">
          Shop
        </a>

        <a href="about.html">
          About
        </a>

        <a href="contact.html">
          Contact
        </a>

        <a
          href="cart.html"
          class="cart-link"
          aria-label="Shopping Cart">

          <svg
            class="cart-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true">

            <circle
              cx="9"
              cy="20"
              r="1">
            </circle>

            <circle
              cx="19"
              cy="20"
              r="1">
            </circle>

            <path
              d="M3 4h2l2.4 11.4a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.6L21 8H6">
            </path>

          </svg>

          <span
            id="cart-count"
            class="cart-count"
            hidden>
            0
          </span>

        </a>

      </nav>

    </div>

  </header>


  <!-- =====================================================
       MAIN STORE
       ===================================================== -->

  <main class="store-container">

    <h1 class="store-title">
      Shop Physical Products
    </h1>


    <p class="store-subtitle">
      Discover quality products available through PRASUN SHOP.
    </p>


    <!-- ===================================================
         SEARCH / SORT
         =================================================== -->

    <div class="products-toolbar">

      <div class="products-search">

        <input
          type="search"
          id="product-search"
          class="products-search-input"
          placeholder="Search products..."
          autocomplete="off"
          aria-label="Search products"
        >

        <button
          type="button"
          id="search-clear"
          class="search-clear"
          aria-label="Clear search"
          aria-hidden="true"
          hidden>
          &times;
        </button>

      </div>


      <select
        id="product-sort"
        class="products-sort"
        aria-label="Sort products">

        <option value="featured">
          Featured
        </option>

        <option value="price-low">
          Price: Low to High
        </option>

        <option value="price-high">
          Price: High to Low
        </option>

        <option value="rating">
          Rating
        </option>

        <option value="name">
          Name
        </option>

      </select>

    </div>


    <!-- ===================================================
         CATEGORIES
         =================================================== -->

    <div
      class="products-categories"
      aria-label="Product categories">

      <button
        type="button"
        class="category-pill active"
        data-category="all"
        aria-pressed="true">

        All

      </button>

    </div>


    <!-- ===================================================
         RESULTS HEADER
         =================================================== -->

    <div class="products-results-bar">

      <h2
        id="products-heading"
        class="products-heading">

        All Products

      </h2>


      <span
        id="products-count"
        class="products-result-count"
        aria-live="polite">

        Loading products...

      </span>

    </div>


    <!-- ===================================================
         DYNAMIC PRODUCT GRID
         =================================================== -->

    <section
      id="product-list"
      class="product-grid"
      aria-label="Products"
      aria-live="polite"
      aria-busy="true">

      <!-- Products are loaded dynamically by products.js -->

      <div
        class="products-empty"
        role="status">

        <p>
          Loading products...
        </p>

      </div>

    </section>

  </main>


  <!-- =====================================================
       FOOTER
       ===================================================== -->

  <footer class="footer">

    <div class="footer-links">

      <a href="privacy.html">
        Privacy Policy
      </a>

      <a href="terms.html">
        Terms of Service
      </a>

      <a href="refund.html">
        Refund Policy
      </a>

      <a href="contact.html">
        Contact
      </a>

    </div>


    <p>

      &copy; 2026 PRASUN SHOP by

      <a
        href="https://prasunbarua.com"
        target="_blank"
        rel="noopener"
      >
        Prasun Barua
      </a>.

      All rights reserved.

    </p>

  </footer>


  <!-- =====================================================
       PRODUCTS JAVASCRIPT
       ===================================================== -->

  <script
    src="products.js"
    defer>
  </script>


</body>
</html>
