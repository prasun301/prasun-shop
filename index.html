<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prasun Shop</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #111111;
    }

    /* Header Styles */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 3rem;
      border-bottom: 1px solid #eaeaea;
      background-color: #ffffff;
    }

    /* Brand Logo */
    .logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
      color: #111111;
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .logo svg {
      width: 24px;
      height: 24px;
      stroke: #111111;
    }

    /* Navigation Links */
    nav {
      display: flex;
      align-items: center;
      gap: 2.5rem;
    }

    nav a {
      text-decoration: none;
      color: #666666;
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.2s ease;
    }

    nav a.active,
    nav a:hover {
      color: #111111;
      font-weight: 600;
    }

    /* Cart Icon Container */
    .cart-container {
      position: relative;
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .cart-icon {
      width: 24px;
      height: 24px;
      stroke: #111111;
      fill: none;
    }

    .cart-badge {
      position: absolute;
      top: -6px;
      right: -8px;
      background-color: #111111;
      color: #ffffff;
      font-size: 0.7rem;
      font-weight: 600;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Page Content Placeholder */
    main {
      padding: 5rem 3rem;
      text-align: center;
    }

    main h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    main p {
      color: #666666;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <!-- Site Header -->
  <header>
    <!-- Updated Brand Name -->
    <a href="#" class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 2 7 12 12 22 7 12 2"/>
        <polyline points="2 17 12 22 22 17"/>
        <polyline points="2 12 12 17 22 12"/>
      </svg>
      Prasun Shop
    </a>

    <!-- Navigation Menu -->
    <nav>
      <a href="#" class="active">Shop</a>
      <a href="#">Categories</a>
      <a href="#">New Arrivals</a>
      <a href="#">About</a>
    </nav>

    <!-- Shopping Bag Icon -->
    <div class="cart-container">
      <svg class="cart-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
        <path d="M16 10a4 4 0 0 1-8 0"/>
      </svg>
      <span class="cart-badge">0</span>
    </div>
  </header>

  <!-- Main Body Content -->
  <main>
    <h1>Welcome to Prasun Shop</h1>
    <p>Your store content goes here.</p>
  </main>

</body>
</html>
