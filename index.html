<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Tech Store</title>
  <meta name="description" content="Explore high-quality smart lighting, power banks, and wireless audio gear." />
  
  <!-- Modern Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* CSS Variables for Clean Design System */
    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #f59e0b;
      --border: #e5e7eb;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
      --shadow-google: 0 1px 6px rgba(32,33,36,0.18);
      --shadow-google-hover: 0 2px 8px rgba(32,33,36,0.28);
      --radius: 12px;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 3rem;
      -webkit-font-smoothing: antialiased;
    }

    /* Container */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.25rem;
    }

    /* Header */
    header {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }
    .header-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 70px;
    }
    .logo {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-main);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .logo span { color: var(--primary); }

    /* Google-Style Search Bar Section */
    .hero-search-section {
      padding: 2.5rem 0 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .hero-title {
      font-size: 1.85rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
      letter-spacing: -0.02em;
    }

    .google-search-wrapper {
      width: 100%;
      max-width: 620px;
      position: relative;
    }
    .google-search-bar {
      display: flex;
      align-items: center;
      background: #ffffff;
      border: 1px solid #dfe1e5;
      border-radius: 28px;
      padding: 0.65rem 1.25rem;
      box-shadow: var(--shadow-google);
      transition: var(--transition);
    }
    .google-search-bar:hover,
    .google-search-bar:focus-within {
      box-shadow: var(--shadow-google-hover);
      border-color: transparent;
    }
    .search-icon {
      color: #9aa0a6;
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      margin-right: 0.75rem;
    }
    .google-search-input {
      border: none;
      outline: none;
      width: 100%;
      font-size: 1rem;
      font-family: inherit;
      color: var(--text-main);
      background: transparent;
    }
    .clear-btn {
      background: none;
      border: none;
      color: #70757a;
      cursor: pointer;
      display: none;
      padding: 4px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }
    .clear-btn:hover { background: #f1f3f4; }
    .clear-btn svg { width: 18px; height: 18px; }

    /* Category Filter Pills */
    .categories-nav {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
      margin: 1.5rem 0 2rem;
    }
    .category-pill {
      background: #ffffff;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.5rem 1.15rem;
      border-radius: 20px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: var(--transition);
      user-select: none;
    }
    .category-pill:hover {
      background: #f1f5f9;
      color: var(--text-main);
    }
    .category-pill.active {
      background: var(--text-main);
      color: #ffffff;
      border-color: var(--text-main);
    }

    /* Product Grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.75rem;
    }

    /* Product Card */
    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: var(--transition);
      position: relative;
    }
    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }

    .card-image-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #f1f5f9;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .product-card:hover .card-image {
      transform: scale(1.03);
    }

    .card-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-category {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 0.35rem;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 0.5rem;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .rating-row {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      margin-bottom: 0.75rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .star-icon {
      width: 16px;
      height: 16px;
      fill: var(--accent);
    }

    .card-footer {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 0.75rem;
      border-top: 1px solid #f1f5f9;
    }
    .card-price {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .btn-detail {
      background: var(--bg-color);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }
    .btn-detail:hover {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    /* No Results Found */
    .no-results {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }
    .no-results h3 { font-size: 1.25rem; color: var(--text-main); margin-bottom: 0.5rem; }

    /* Modal for Detailed Specifications */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      padding: 1rem;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-card {
      background: #ffffff;
      border-radius: 16px;
      max-width: 650px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.75rem;
      position: relative;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      transform: translateY(10px);
      transition: transform 0.2s ease;
    }
    .modal-overlay.open .modal-card {
      transform: translateY(0);
    }
    .close-modal-btn {
      position: absolute;
      top: 1.25rem;
      right: 1.25rem;
      background: #f1f5f9;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-title { font-size: 1.35rem; font-weight: 700; margin-bottom: 0.5rem; padding-right: 2rem; }
    .modal-sku { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 1rem; }
    .modal-desc { margin-bottom: 1.25rem; color: #4b5563; font-size: 0.95rem; }
    
    .modal-section-title {
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 1rem 0 0.5rem;
      color: var(--text-main);
    }
    .modal-features { list-style: disc; padding-left: 1.25rem; font-size: 0.9rem; color: #4b5563; }
    .modal-features li { margin-bottom: 0.25rem; }

    .specs-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.5rem;
      font-size: 0.875rem;
    }
    .specs-table td {
      padding: 0.5rem 0;
      border-bottom: 1px solid #f1f5f9;
    }
    .specs-table td:first-child { font-weight: 600; width: 40%; color: var(--text-main); }
    .specs-table td:last-child { color: var(--text-muted); }

    /* Utilities */
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header>
    <div class="container header-content">
      <a href="#" class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
        Smart<span>Store</span>
      </a>
    </div>
  </header>

  <main class="container">
    <!-- Google-Style Search Section -->
    <section class="hero-search-section">
      <h1 class="hero-title">Find Products Instantly</h1>
      
      <div class="google-search-wrapper">
        <div class="google-search-bar">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input 
            type="text" 
            id="searchInput" 
            class="google-search-input" 
            placeholder="Search products by name, SKU, or feature..." 
            autocomplete="off"
            spellcheck="false"
          />
          <button id="clearSearchBtn" class="clear-btn" aria-label="Clear Search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
      </div>

      <!-- Category Filter Pills -->
      <nav class="categories-nav" aria-label="Product Categories" id="categoryNav">
        <button class="category-pill active" data-category="All">All</button>
        <button class="category-pill" data-category="Smart Lighting">Smart Lighting</button>
        <button class="category-pill" data-category="Power & Charging">Power & Charging</button>
        <button class="category-pill" data-category="Audio">Audio</button>
      </nav>
    </section>

    <!-- Product Grid -->
    <section id="productGrid" class="product-grid" aria-live="polite">
      <!-- Cards rendered dynamically via JS -->
    </section>

    <!-- Fallback State -->
    <div id="noResults" class="no-results hidden">
      <h3>No matching products found</h3>
      <p>Try searching for a different keyword or select another category.</p>
    </div>
  </main>

  <!-- Quick View Specifications Modal -->
  <div id="productModal" class="modal-overlay" aria-hidden="true">
    <div class="modal-card">
      <button class="close-modal-btn" id="closeModalBtn" aria-label="Close modal">&times;</button>
      <div id="modalContent">
        <!-- Content dynamic via JS -->
      </div>
    </div>
  </div>

  <script>
    /**
     * Exact 3 Product Dataset (Fallback + Primary Source)
     * Loaded seamlessly if /api/products.json is not present locally.
     */
    const INITIAL_PRODUCTS = [
      {
        "id": "001",
        "sku": "CJSN188416414NM",
        "name": "G-Shaped Smart LED Atmosphere Lamp with Bluetooth Speaker & Wireless Charger",
        "category": "Smart Lighting",
        "price": 29.99,
        "rating": 5.0,
        "image": "images/products/g-shaped-lamp.webp",
        "description": "Upgrade your living space with this multifunctional G-shaped Smart LED Atmosphere Lamp combining customizable lighting, Bluetooth audio, 15W wireless charging, and alarm clock controls.",
        "features": [
          "15W fast wireless charging",
          "Built-in Bluetooth speaker",
          "RGB atmosphere lighting",
          "APP, voice, remote and button control",
          "Adjustable brightness (1%-100%)",
          "Multiple light color modes",
          "Smart wake-up and sleep mode",
          "Modern decorative design"
        ],
        "specifications": {
          "Material": "Plastic",
          "Product Type": "Electronic Smart Lamp",
          "Color Options": "Black, Light Grey, White",
          "Dimensions": "22.5 × 8.2 × 23 cm",
          "Package Size": "227 × 86 × 240 mm",
          "Wireless Charging": "15W",
          "Control": "APP / Voice / Remote / Button",
          "Power Input": "100-240V"
        }
      },
      {
        "id": "002",
        "sku": "CJCD135893009IR",
        "name": "Mini 5000mAh Magnetic Wireless Power Bank Fast Charging Portable Battery",
        "category": "Power & Charging",
        "price": 39.99,
        "rating": 5.0,
        "image": "images/products/mini-magnetic-powerbank.webp",
        "description": "Compact 5000mAh Magnetic Wireless Power Bank featuring strong magnetic attachment, fast charging, LED power display, and an airplane-safe portable design.",
        "features": [
          "5000mAh battery capacity",
          "Strong magnetic wireless charging",
          "Six-level magnetic adsorption system",
          "Fast charging technology",
          "LED battery display",
          "Supports wireless and wired charging",
          "Compact and travel-friendly design",
          "Airplane safe portable battery"
        ],
        "specifications": {
          "Material": "Plastic",
          "Product Type": "Portable Power Bank",
          "Capacity": "5000mAh",
          "Input / Output": "5V / 2.1A",
          "Wireless Charging": "5W",
          "Dimensions": "91 × 64 × 15 mm",
          "Color Options": "Cool Black, Retro Green, Ivory White, Cherry Blossom Pink",
          "Compatibility": "Apple & Qi-compatible devices"
        }
      },
      {
        "id": "003",
        "sku": "CJYP270967903CX",
        "name": "High-Quality Noise Cancelling Wireless Bluetooth Sports Earbuds",
        "category": "Audio",
        "price": 49.99,
        "rating": 5.0,
        "image": "images/products/noise-cancelling-earbuds.webp",
        "description": "Immersive sound with these Noise Cancelling Wireless Bluetooth Sports Earbuds. Designed for workouts, travel, and low-latency gaming with extended battery performance.",
        "features": [
          "Noise cancellation technology",
          "Bluetooth wireless connection",
          "Water-resistant design",
          "Low-latency gaming mode",
          "Voice control support",
          "Hands-free calling",
          "Long battery life",
          "Comfortable in-ear design"
        ],
        "specifications": {
          "Material": "PC + ABS",
          "Product Type": "Wireless Bluetooth Earbuds",
          "Wearing Style": "In-ear",
          "Transmission Distance": "10 meters",
          "Battery Life": "4-8 hours",
          "Color Options": "White, Skin Tone, Black",
          "Package Size": "120 × 100 × 60 mm"
        }
      }
    ];

    // State
    let products = [];
    let selectedCategory = "All";
    let searchQuery = "";

    // DOM Elements
    const productGrid = document.getElementById('productGrid');
    const noResults = document.getElementById('noResults');
    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const categoryNav = document.getElementById('categoryNav');
    const modalOverlay = document.getElementById('productModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const modalContent = document.getElementById('modalContent');

    // Safe SVG Placeholder for missing local images
    const createPlaceholderSVG = (text) => `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300"><rect width="100%" height="100%" fill="%23f1f5f9"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="14" fill="%2394a3b8">${encodeURIComponent(text)}</text></svg>`;

    /**
     * Load Dataset (Fetch API or Fallback)
     */
    async function loadProducts() {
      try {
        const res = await fetch('/api/products.json');
        if (!res.ok) throw new Error('API unavailable');
        products = await res.json();
      } catch (err) {
        // Fallback gracefully to predefined data
        products = INITIAL_PRODUCTS;
      }
      renderProducts();
    }

    /**
     * Render Product Cards with DocumentFragment for maximum performance
     */
    function renderProducts() {
      const filtered = products.filter(product => {
        const matchesCategory = selectedCategory === "All" || product.category === selectedCategory;
        const query = searchQuery.toLowerCase().trim();
        const matchesSearch = !query || 
          product.name.toLowerCase().includes(query) ||
          product.category.toLowerCase().includes(query) ||
          product.sku.toLowerCase().includes(query) ||
          product.description.toLowerCase().includes(query);

        return matchesCategory && matchesSearch;
      });

      productGrid.innerHTML = '';

      if (filtered.length === 0) {
        noResults.classList.remove('hidden');
        return;
      }

      noResults.classList.add('hidden');
      const fragment = document.createDocumentFragment();

      filtered.forEach(product => {
        const card = document.createElement('article');
        card.className = 'product-card';

        card.innerHTML = `
          <div class="card-image-wrap">
            <img 
              src="${product.image}" 
              alt="${product.name}" 
              class="card-image" 
              loading="lazy" 
              onerror="this.src='${createPlaceholderSVG(product.category)}'" 
            />
          </div>
          <div class="card-body">
            <span class="card-category">${product.category}</span>
            <h2 class="card-title">${product.name}</h2>
            <div class="rating-row">
              <svg class="star-icon" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
              <span><strong>${product.rating.toFixed(1)}</strong> (100% positive)</span>
            </div>
            <div class="card-footer">
              <span class="card-price">$${product.price.toFixed(2)}</span>
              <button class="btn-detail" onclick="openProductModal('${product.id}')">Quick View</button>
            </div>
          </div>
        `;
        fragment.appendChild(card);
      });

      productGrid.appendChild(fragment);
    }

    /**
     * Modal Operations
     */
    window.openProductModal = function(id) {
      const product = products.find(p => p.id === id);
      if (!product) return;

      const specsRows = Object.entries(product.specifications || {})
        .map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`)
        .join('');

      const featuresList = (product.features || [])
        .map(f => `<li>${f}</li>`)
        .join('');

      modalContent.innerHTML = `
        <h2 class="modal-title">${product.name}</h2>
        <div class="modal-sku">SKU: ${product.sku} | Category: ${product.category}</div>
        <p class="modal-desc">${product.description}</p>
        
        <h3 class="modal-section-title">Key Features</h3>
        <ul class="modal-features">${featuresList}</ul>

        <h3 class="modal-section-title">Specifications</h3>
        <table class="specs-table">
          <tbody>${specsRows}</tbody>
        </table>
      `;

      modalOverlay.classList.add('open');
      modalOverlay.setAttribute('aria-hidden', 'false');
    };

    function closeModal() {
      modalOverlay.classList.remove('open');
      modalOverlay.setAttribute('aria-hidden', 'true');
    }

    /* Event Listeners */

    // Instant Google-Style Search
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      clearSearchBtn.style.display = searchQuery.length > 0 ? 'flex' : 'none';
      renderProducts();
    });

    clearSearchBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      clearSearchBtn.style.display = 'none';
      searchInput.focus();
      renderProducts();
    });

    // Category Pill Selector
    categoryNav.addEventListener('click', (e) => {
      if (!e.target.classList.contains('category-pill')) return;
      
      document.querySelectorAll('.category-pill').forEach(btn => btn.classList.remove('active'));
      e.target.classList.add('active');
      
      selectedCategory = e.target.getAttribute('data-category');
      renderProducts();
    });

    // Modal Close handlers
    closeModalBtn.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modalOverlay.classList.contains('open')) closeModal();
    });

    // Initialize App
    loadProducts();
  </script>
</body>
</html>
