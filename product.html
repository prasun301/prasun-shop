<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View product details and add smart products to your Prasun Shop cart.">
  <title>Product Details — Prasun Shop</title>

  <!-- Early Connection Hints for External Assets -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Preload Critical Google Font Stylesheet -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  </noscript>

  <!-- Compiled Tailwind CSS (Production Build Replacement for JIT CDN) -->
  <link rel="stylesheet" href="css/tailwind.css">

  <!-- Custom CSS Overrides -->
  <link rel="stylesheet" href="css/style.css">

  <!-- JavaScript Modules (Deferred for Non-Blocking Initial Render) -->
  <script src="js/cart-count.js" defer></script>
  <script src="js/product.js" defer></script>
</head>

<body class="bg-zinc-50 text-zinc-900 font-sans antialiased selection:bg-zinc-950 selection:text-white min-h-screen flex flex-col">

  <!-- Header -->
  <header class="header">
    <div class="container">

      <!-- Brand -->
      <a href="index.html" class="logo" aria-label="Prasun Shop Home">
        <svg class="logo-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 10h16"/>
          <path d="M5 10v10h14V10"/>
          <path d="M3 10l2-6h14l2 6"/>
          <path d="M9 20v-5h6v5"/>
          <path d="M3 10c0 1.1.9 2 2 2s2-.9 2-2c0 1.1.9 2 2 2s2-.9 2-2c0 1.1.9 2 2 2s2-.9 2-2c0 1.1.9 2 2 2s2-.9 2-2"/>
        </svg>
        <span>Prasun Shop</span>
      </a>

      <!-- Desktop Navigation -->
      <nav class="nav" aria-label="Primary Navigation">
        <ul class="nav-list">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="products.html" class="nav-link">Products</a></li>
          <li><a href="about.html" class="nav-link">About</a></li>
          <li><a href="contact.html" class="nav-link">Contact</a></li>
        </ul>
      </nav>

      <!-- Header Actions -->
      <div class="header-actions">
        <!-- Cart -->
        <a href="cart.html" class="cart-icon-wrap" aria-label="Shopping cart">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 7h12l1 13H5L6 7Z"/>
            <path d="M9 7V5a3 3 0 0 1 6 0v2"/>
          </svg>
          <span id="cart-count" class="cart-badge" aria-live="polite" aria-atomic="true" hidden>0</span>
        </a>

        <!-- Mobile Menu Toggle -->
        <button type="button" id="mobile-menu-button" class="mobile-menu-btn" aria-controls="mobile-menu" aria-expanded="false" aria-label="Open navigation menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M4 6h16"/>
            <path d="M4 12h16"/>
            <path d="M4 18h16"/>
          </svg>
        </button>
      </div>

    </div>

    <!-- Mobile Navigation -->
    <div id="mobile-menu" class="mobile-menu" hidden>
      <nav aria-label="Mobile Navigation">
        <a href="index.html" class="mobile-nav-link">Home</a>
        <a href="products.html" class="mobile-nav-link">Products</a>
        <a href="about.html" class="mobile-nav-link">About</a>
        <a href="contact.html" class="mobile-nav-link">Contact</a>
        <a href="cart.html" class="mobile-nav-link">Cart</a>
      </nav>
    </div>
  </header>

  <!-- Breadcrumb -->
  <nav class="product-breadcrumb" aria-label="Breadcrumb">
    <div class="container">
      <a href="index.html">Home</a>
      <span aria-hidden="true">/</span>
      <a href="products.html">Products</a>
      <span aria-hidden="true">/</span>
      <span aria-current="page">Details</span>
    </div>
  </nav>

  <!-- Product Details -->
  <main class="flex-grow">
    <section class="product-page">
      <div class="container">
        <div id="product-detail" aria-live="polite">
          <!-- Loading Skeleton with Aspect Ratio Reserved Space (CLS Prevention) -->
          <div class="product-detail-loading grid grid-cols-1 md:grid-cols-2 gap-8 animate-pulse" aria-hidden="true">
            <div class="product-loading-image w-full aspect-square bg-zinc-200 rounded-lg"></div>
            <div class="product-loading-info flex flex-col justify-center space-y-4">
              <div class="h-4 bg-zinc-200 rounded w-1/4"></div>
              <div class="h-8 bg-zinc-200 rounded w-3/4"></div>
              <div class="h-6 bg-zinc-200 rounded w-1/3"></div>
              <div class="space-y-2 pt-4">
                <div class="h-4 bg-zinc-200 rounded w-full"></div>
                <div class="h-4 bg-zinc-200 rounded w-5/6"></div>
                <div class="h-4 bg-zinc-200 rounded w-2/3"></div>
              </div>
              <div class="h-12 bg-zinc-200 rounded-md w-full sm:w-48 mt-6"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="border-t border-zinc-200/80 bg-white py-8 mt-auto">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-zinc-500 font-medium">
      <p>&copy; 2026 Prasun Shop. All rights reserved.</p>
      <div class="flex items-center gap-6">
        <a href="#" class="hover:text-zinc-900 transition-colors">Privacy Policy</a>
        <a href="#" class="hover:text-zinc-900 transition-colors">Terms of Service</a>
      </div>
    </div>
  </footer>

  <!-- Mobile Menu Logic (Non-blocking IIFE) -->
  <script>
    (() => {
      const btn = document.getElementById('mobile-menu-button');
      const menu = document.getElementById('mobile-menu');
      if (!btn || !menu) return;

      btn.addEventListener('click', () => {
        const isExpanded = btn.getAttribute('aria-expanded') === 'true';
        btn.setAttribute('aria-expanded', !isExpanded);
        btn.setAttribute('aria-label', !isExpanded ? 'Close navigation menu' : 'Open navigation menu');
        menu.hidden = isExpanded;
        menu.classList.toggle('open', !isExpanded);
      });
    })();
  </script>

</body>

</html>
