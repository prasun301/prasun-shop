<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details — PRASUN SHOP</title>
  <meta name="description" content="View product details and purchase securely at PRASUN SHOP." />
  <style>
    :root {
      --apple-bg: #f5f5f7;
      --apple-card-bg: #ffffff;
      --apple-text: #1d1d1f;
      --apple-gray: #86868b;
      --apple-border: #d2d2d7;
      --apple-dark: #1d1d1f;
      --apple-dark-hover: #333336;
      --apple-blue: #0071e3;
    }

    body {
      background-color: var(--apple-card-bg);
      color: var(--apple-text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      margin: 0;
      -webkit-font-smoothing: antialiased;
    }

    .header {
      border-bottom: 1px solid var(--apple-border);
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 100;
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--apple-text);
      font-weight: 600;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--apple-gray);
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--apple-text);
    }

    .cart-icon-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      color: var(--apple-text);
      text-decoration: none;
    }

    .cart-badge {
      position: absolute;
      top: -8px;
      right: -10px;
      background-color: var(--apple-dark);
      color: white;
      font-size: 0.7rem;
      font-weight: 600;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: inline-flex;
      justify-content: center;
      align-items: center;
    }

    .product-main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 3rem 2rem 5rem 2rem;
    }

    .breadcrumbs {
      font-size: 0.85rem;
      color: var(--apple-gray);
      margin-bottom: 2rem;
    }

    .breadcrumbs a {
      color: var(--apple-gray);
      text-decoration: none;
    }

    .breadcrumbs a:hover {
      color: var(--apple-text);
    }

    .product-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: center;
    }

    @media (max-width: 768px) {
      .product-grid {
        grid-template-columns: 1fr;
        gap: 2rem;
      }
    }

    .product-image-container {
      background-color: var(--apple-bg);
      border: 1px solid var(--apple-border);
      border-radius: 24px;
      padding: 3rem;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 380px;
      box-sizing: border-box;
    }

    .product-image-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .product-details {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .product-title {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.015em;
      margin: 0;
    }

    .product-price {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--apple-text);
    }

    .product-description {
      font-size: 1.05rem;
      color: var(--apple-gray);
      line-height: 1.5;
      margin: 0;
    }

    .btn-apple-primary {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      background-color: var(--apple-dark);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 500;
      padding: 0.9rem 2rem;
      border-radius: 980px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.2s ease, transform 0.1s ease;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
      margin-top: 1rem;
    }

    .btn-apple-primary:hover {
      background-color: var(--apple-dark-hover);
    }

    .btn-apple-primary:active {
      transform: scale(0.98);
    }

    .footer {
      border-top: 1px solid var(--apple-border);
      background-color: var(--apple-bg);
      padding: 2rem;
      text-align: center;
      color: var(--apple-gray);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-container">
      <a href="index.html" class="logo" aria-label="PRASUN SHOP Homepage">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
        <span>PRASUN SHOP</span>
      </a>
      <nav class="nav-links" aria-label="Main Navigation">
        <a href="index.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="checkout.html">Checkout</a>
      </nav>
      <div class="header-actions">
        <a href="cart.html" class="cart-icon-wrap" aria-label="View Shopping Cart">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span id="cart-count" class="cart-badge">0</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Product Main Content -->
  <main class="product-main">
    <nav class="breadcrumbs" aria-label="Breadcrumb">
      <a href="index.html">Home</a> / <span id="breadcrumb-title" style="color: var(--apple-text);">Product</span>
    </nav>

    <div class="product-grid" id="product-container">
      <!-- Dynamically injected product info -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2026 PRASUN SHOP. All rights reserved.</p>
  </footer>

  <script>
    // Product Database Registry
    const productsData = {
      "smart-lamp": {
        id: "smart-lamp",
        title: "Smart Lamp LED",
        price: "$49.00",
        description: "Adaptive lighting engineered with seamless touch response and multiple color temperatures to suit your environment.",
        image: "images/products/10_57d942b5-c025-425a-a8a4-d87c6a612631.png"
      },
      "wireless-buds": {
        id: "wireless-buds",
        title: "Wireless Pro Earbuds",
        price: "$129.00",
        description: "Immersive spatial audio with active noise cancellation, custom acoustic drivers, and all-day battery life.",
        image: "images/products/1_6c876bad-b1e0-4d44-9c62-e7c1d9daadb1_trans.jpeg"
      },
      "power-bank": {
        id: "power-bank",
        title: "Ultra-Slim Power Bank",
        price: "$59.00",
        description: "High-capacity portable charging packed into an ultra-slim aerospace aluminum shell with fast-delivery power output.",
        image: "images/products/1_d000e27d-654f-42a9-a69e-fa741145c989.jpg"
      }
    };

    function updateCartBadge() {
      try {
        const cart = JSON.parse(localStorage.getItem('prasun_cart')) || [];
        const totalItems = cart.reduce((sum, item) => sum + (Number(item.quantity) || 1), 0);
        const badge = document.getElementById('cart-count');
        if (badge) {
          badge.textContent = totalItems;
        }
      } catch (e) {
        console.error(e);
      }
    }

    function addToCart(productId) {
      const product = productsData[productId];
      if (!product) return;

      let cart = [];
      try {
        cart = JSON.parse(localStorage.getItem('prasun_cart')) || [];
      } catch (e) {
        cart = [];
      }

      const existingIndex = cart.findIndex(item => item.id === productId);
      if (existingIndex > -1) {
        cart[existingIndex].quantity = (Number(cart[existingIndex].quantity) || 1) + 1;
      } else {
        cart.push({
          id: product.id,
          title: product.title,
          price: product.price,
          image: product.image,
          quantity: 1
        });
      }

      localStorage.setItem('prasun_cart', JSON.stringify(cart));
      updateCartBadge();
      alert(`Added ${product.title} to your bag!`);
    }

    function loadProduct() {
      updateCartBadge();
      const params = new URLSearchParams(window.location.search);
      const productId = params.get('id') || 'smart-lamp';
      const product = productsData[productId] || productsData['smart-lamp'];

      document.getElementById('breadcrumb-title').textContent = product.title;
      
      const container = document.getElementById('product-container');
      container.innerHTML = `
        <div class="product-image-container">
          <img src="${product.image}" alt="${product.title}" />
        </div>
        <div class="product-details">
          <h1 class="product-title">${product.title}</h1>
          <div class="product-price">${product.price}</div>
          <p class="product-description">${product.description}</p>
          <button class="btn-apple-primary" onclick="addToCart('${product.id}')">Add to Bag</button>
        </div>
      `;
    }

    document.addEventListener('DOMContentLoaded', loadProduct);
  </script>
</body>
</html>
