<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="View product details at PRASUN SHOP."
    >

    <title>Product Details — PRASUN SHOP</title>

    <style>

        :root {
            --bg: #ffffff;
            --soft-bg: #f4f4f5;
            --text: #18181b;
            --muted: #71717a;
            --border: #e4e4e7;
            --dark: #18181b;
            --dark-hover: #27272a;
            --success: #059669;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                "Helvetica Neue",
                Arial,
                sans-serif;

            -webkit-font-smoothing: antialiased;
        }

        a {
            color: inherit;
        }


        /* ================================================================
           HEADER
           ================================================================ */

        .header {
            position: sticky;
            top: 0;
            z-index: 1000;

            background: rgba(255, 255, 255, 0.88);

            border-bottom: 1px solid var(--border);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .header-container {
            width: min(1200px, calc(100% - 32px));

            min-height: 68px;

            margin: 0 auto;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 24px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            color: var(--text);

            text-decoration: none;

            font-size: 15px;
            font-weight: 700;

            white-space: nowrap;
        }

        .logo svg {
            width: 21px;
            height: 21px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 26px;
        }

        .nav-links a {
            color: var(--muted);

            text-decoration: none;

            font-size: 13px;
            font-weight: 500;

            transition:
                color 0.2s ease;
        }

        .nav-links a:hover {
            color: var(--text);
        }

        .header-actions {
            display: flex;
            align-items: center;
        }

        .cart-icon-wrap {
            position: relative;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            width: 38px;
            height: 38px;

            color: var(--text);

            text-decoration: none;
        }

        .cart-badge {
            position: absolute;

            top: -2px;
            right: -3px;

            min-width: 18px;
            height: 18px;

            padding: 0 5px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            border-radius: 999px;

            background: var(--dark);
            color: #ffffff;

            font-size: 10px;
            font-weight: 700;

            line-height: 1;
        }

        .cart-badge[hidden] {
            display: none;
        }


        /* ================================================================
           MAIN
           ================================================================ */

        .product-main {
            width: min(1120px, calc(100% - 32px));

            margin: 0 auto;

            padding: 34px 0 80px;
        }


        /* ================================================================
           BREADCRUMBS
           ================================================================ */

        .breadcrumbs {
            margin-bottom: 28px;

            color: var(--muted);

            font-size: 13px;
            font-weight: 500;
        }

        .breadcrumbs a {
            color: var(--muted);

            text-decoration: none;
        }

        .breadcrumbs a:hover {
            color: var(--text);
        }

        .breadcrumb-current {
            color: var(--text);
        }


        /* ================================================================
           PRODUCT CONTAINER
           ================================================================ */

        #product-detail {
            min-height: 420px;
        }


        /* ================================================================
           LOADING
           ================================================================ */

        .product-loading {
            min-height: 420px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;

            color: var(--muted);
        }

        .loading-spinner {
            width: 34px;
            height: 34px;

            margin-bottom: 18px;

            border: 3px solid var(--border);
            border-top-color: var(--dark);

            border-radius: 50%;

            animation:
                productSpin 0.8s linear infinite;
        }

        @keyframes productSpin {
            to {
                transform: rotate(360deg);
            }
        }

        .product-loading p {
            margin: 0;

            font-size: 14px;
        }


        /* ================================================================
           PRODUCT GRID
           ================================================================ */

        .product-grid {
            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                minmax(0, 1fr);

            gap: 64px;

            align-items: start;
        }


        /* ================================================================
           IMAGE
           ================================================================ */

        .product-image-container {
            position: sticky;
            top: 94px;

            width: 100%;
            aspect-ratio: 1 / 1;

            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--soft-bg);

            border: 1px solid var(--border);

            border-radius: 24px;
        }

        .product-image-container img {
            width: 100%;
            height: 100%;

            object-fit: contain;

            padding: 28px;

            display: block;
        }


        /* ================================================================
           PRODUCT DETAILS
           ================================================================ */

        .product-details {
            min-width: 0;
        }

        .product-category-row {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 16px;

            margin-bottom: 18px;
        }

        .product-category {
            display: inline-flex;
            align-items: center;

            padding: 6px 10px;

            border-radius: 999px;

            background: var(--soft-bg);

            color: #3f3f46;

            font-size: 11px;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .product-rating {
            color: #52525b;

            font-size: 12px;
            font-weight: 600;
        }

        .product-rating-star {
            color: #d97706;
        }

        .product-title {
            margin: 0 0 16px;

            color: var(--text);

            font-size: clamp(28px, 4vw, 42px);

            line-height: 1.08;

            letter-spacing: -0.035em;

            font-weight: 750;
        }

        .product-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;

            gap: 14px;

            margin-bottom: 24px;

            color: var(--muted);

            font-size: 12px;
        }

        .product-stock {
            display: inline-flex;
            align-items: center;
            gap: 6px;

            color: var(--success);

            font-weight: 600;
        }

        .stock-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: var(--success);
        }

        .product-price {
            padding: 0 0 24px;

            margin-bottom: 22px;

            border-bottom: 1px solid var(--border);

            color: var(--text);

            font-size: 28px;
            font-weight: 750;
        }

        .product-description {
            margin: 0 0 28px;

            color: #52525b;

            font-size: 15px;

            line-height: 1.7;
        }


        /* ================================================================
           QUANTITY
           ================================================================ */

        .quantity-row {
            display: flex;
            align-items: center;
            gap: 16px;

            margin-bottom: 24px;
        }

        .quantity-label {
            color: #3f3f46;

            font-size: 12px;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .quantity-control {
            display: inline-flex;
            align-items: center;

            overflow: hidden;

            border: 1px solid var(--border);

            border-radius: 12px;

            background: #ffffff;
        }

        .quantity-control button {
            width: 40px;
            height: 40px;

            border: 0;

            background: transparent;

            color: #52525b;

            font-size: 20px;

            cursor: pointer;

            transition:
                background 0.2s ease,
                color 0.2s ease;
        }

        .quantity-control button:hover {
            background: var(--soft-bg);
            color: var(--text);
        }

        .quantity-control input {
            width: 44px;
            height: 40px;

            border: 0;

            outline: 0;

            background: transparent;

            color: var(--text);

            text-align: center;

            font-size: 14px;
            font-weight: 700;
        }

        .quantity-control input::-webkit-inner-spin-button,
        .quantity-control input::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .quantity-control input[type="number"] {
            -moz-appearance: textfield;
        }


        /* ================================================================
           BUTTONS
           ================================================================ */

        .button-group {
            display: grid;

            grid-template-columns:
                1fr
                1fr;

            gap: 12px;

            margin-bottom: 28px;
        }

        .product-button {
            min-height: 50px;

            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;

            padding: 0 20px;

            border-radius: 13px;

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.2s ease,
                border-color 0.2s ease,
                opacity 0.2s ease;
        }

        .product-button:active {
            transform: scale(0.98);
        }

        .product-button:disabled {
            cursor: default;
            opacity: 0.65;
        }

        .product-button-secondary {
            border: 1px solid #d4d4d8;

            background: #ffffff;

            color: var(--text);
        }

        .product-button-secondary:hover {
            background: #fafafa;
            border-color: #a1a1aa;
        }

        .product-button-primary {
            border: 1px solid var(--dark);

            background: var(--dark);

            color: #ffffff;
        }

        .product-button-primary:hover {
            background: var(--dark-hover);
        }


        /* ================================================================
           FEATURES / SPECS
           ================================================================ */

        .product-extra-section {
            padding-top: 24px;

            margin-top: 8px;

            border-top: 1px solid var(--border);
        }

        .product-extra-section + .product-extra-section {
            margin-top: 24px;
        }

        .product-extra-title {
            margin: 0 0 14px;

            color: var(--text);

            font-size: 12px;
            font-weight: 750;

            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .feature-list {
            display: grid;

            grid-template-columns:
                1fr
                1fr;

            gap: 10px 18px;

            padding: 0;
            margin: 0;

            list-style: none;
        }

        .feature-list li {
            display: flex;
            align-items: flex-start;
            gap: 9px;

            color: #52525b;

            font-size: 13px;

            line-height: 1.5;
        }

        .feature-dot {
            width: 6px;
            height: 6px;

            flex: 0 0 6px;

            margin-top: 7px;

            border-radius: 50%;

            background: var(--text);
        }

        .spec-table {
            width: 100%;

            border-collapse: collapse;

            overflow: hidden;

            border: 1px solid var(--border);

            border-radius: 12px;

            font-size: 12px;
        }

        .spec-table td {
            padding: 11px 13px;

            border-bottom: 1px solid var(--border);

            vertical-align: top;
        }

        .spec-table tr:last-child td {
            border-bottom: 0;
        }

        .spec-table td:first-child {
            width: 36%;

            background: #fafafa;

            color: var(--muted);

            font-weight: 600;
        }

        .spec-table td:last-child {
            color: var(--text);
        }


        /* ================================================================
           ERROR / NOT FOUND
           ================================================================ */

        .product-error {
            min-height: 420px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 40px;

            text-align: center;
        }

        .product-error h2 {
            margin: 0 0 10px;

            font-size: 24px;
        }

        .product-error p {
            max-width: 520px;

            margin: 0 0 22px;

            color: var(--muted);

            font-size: 14px;
            line-height: 1.6;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 44px;

            padding: 0 18px;

            border-radius: 12px;

            background: var(--dark);
            color: #ffffff;

            text-decoration: none;

            font-size: 13px;
            font-weight: 700;
        }

        .back-button:hover {
            background: var(--dark-hover);
        }


        /* ================================================================
           FOOTER
           ================================================================ */

        .footer {
            border-top: 1px solid var(--border);

            background: var(--soft-bg);

            padding: 26px 16px;

            text-align: center;

            color: var(--muted);

            font-size: 12px;
        }

        .footer p {
            margin: 0;
        }


        /* ================================================================
           MOBILE
           ================================================================ */

        @media (max-width: 850px) {

            .header-container {
                min-height: 62px;
            }

            .nav-links {
                display: none;
            }

            .product-main {
                padding-top: 24px;
                padding-bottom: 60px;
            }

            .product-grid {
                grid-template-columns: 1fr;

                gap: 30px;
            }

            .product-image-container {
                position: relative;
                top: auto;

                border-radius: 20px;
            }

            .product-title {
                font-size: 30px;
            }

        }


        @media (max-width: 560px) {

            .product-main {
                width: min(
                    100% - 24px,
                    1120px
                );
            }

            .product-image-container img {
                padding: 18px;
            }

            .product-category-row {
                align-items: flex-start;
                flex-direction: column;
            }

            .button-group {
                grid-template-columns: 1fr;
            }

            .feature-list {
                grid-template-columns: 1fr;
            }

            .product-title {
                font-size: 27px;
            }

            .product-price {
                font-size: 25px;
            }
        }

    </style>
</head>


<body>


    <!-- ================================================================
         HEADER
         ================================================================ -->

    <header class="header">

        <div class="header-container">

            <a
                href="index.html"
                class="logo"
                aria-label="PRASUN SHOP Homepage"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <path d="M16 10a4 4 0 0 1-8 0"></path>
                </svg>

                <span>PRASUN SHOP</span>

            </a>


            <nav
                class="nav-links"
                aria-label="Main Navigation"
            >

                <a href="index.html">
                    Shop
                </a>

                <a href="about.html">
                    About
                </a>

                <a href="contact.html">
                    Contact
                </a>

                <a href="checkout.html">
                    Checkout
                </a>

            </nav>


            <div class="header-actions">

                <a
                    href="cart.html"
                    class="cart-icon-wrap"
                    aria-label="View Shopping Cart"
                >

                    <svg
                        width="22"
                        height="22"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <circle
                            cx="9"
                            cy="21"
                            r="1"
                        ></circle>

                        <circle
                            cx="20"
                            cy="21"
                            r="1"
                        ></circle>

                        <path
                            d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"
                        ></path>
                    </svg>


                    <span
                        id="cart-count"
                        class="cart-badge"
                        hidden
                    >
                        0
                    </span>

                </a>

            </div>

        </div>

    </header>


    <!-- ================================================================
         MAIN
         ================================================================ -->

    <main class="product-main">

        <nav
            class="breadcrumbs"
            aria-label="Breadcrumb"
        >

            <a href="index.html">
                Home
            </a>

            <span aria-hidden="true">
                &nbsp;/&nbsp;
            </span>

            <span
                id="breadcrumb-title"
                class="breadcrumb-current"
            >
                Product
            </span>

        </nav>


        <div id="product-detail">

            <div class="product-loading">

                <div
                    class="loading-spinner"
                    aria-hidden="true"
                ></div>

                <p>
                    Loading product details...
                </p>

            </div>

        </div>

    </main>


    <!-- ================================================================
         FOOTER
         ================================================================ -->

    <footer class="footer">

        <p>
            &copy; 2026 PRASUN SHOP. All rights reserved.
        </p>

    </footer>


    <!-- ================================================================
         PRODUCT JS
         ================================================================ -->

    <script
        src="product.js"
        defer
    ></script>


</body>
</html>
