<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore our collection of minimal and modern products at Prasun Shop.">
  <title>Products — Prasun Shop</title>

  <!-- Google Fonts: Inter (Optimized Loading) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Enterprise Production Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
  
  <!-- Inline style for skeleton pulse (keeps CSS clean) -->
  <style>
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .skeleton { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    .skeleton-box { background-color: var(--color-bg-muted); border-radius: var(--radius-sm); }
  </style>
</head>

<body>

  <!-- Glassmorphism Header -->
  <header class="header">
    <div class="container nav-wrapper">
      
      <!-- Brand Logo -->
      <a href="index.html" class="logo">
        Prasun Shop<span style="color: var(--color-primary);">.</span>
      </a>

      <!-- Desktop Nav Links -->
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="products.html" class="nav-link" aria-current="page">Products</a>
        <a href="#" class="nav-link">About</a>
        <a href="#" class="nav-link">Contact</a>
      </nav>

      <!-- Cart Icon & Actions -->
      <a href="#" class="cart-icon" aria-label="Shopping Cart">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
        </svg>
        <span id="cart-count" class="cart-badge">0</span>
      </a>

    </div>
  </header>

  <!-- Main Content -->
  <main class="container section">
    
    <!-- Page Header & Filter Controls -->
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: var(--space-6); border-bottom: 1px solid var(--color-border-subtle); padding-bottom: var(--space-8); margin-bottom: var(--space-10);">
      
      <div>
        <h1 class="h2">Our Products</h1>
        <p class="text-body">Discover high-quality essentials crafted for modern life.</p>
      </div>

      <!-- Spotlight Search Component -->
      <div class="search-box" style="max-width: 320px; margin-bottom: 0;">
        <input type="search" placeholder="Search items..." class="search-input" style="height: 48px; border-radius: var(--radius-md); font-size: 0.9375rem;">
        <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <div class="search-kbd-hint">
          <kbd>⌘</kbd><kbd>K</kbd>
        </div>
      </div>

    </div>

    <!-- Dynamic Product Grid -->
    <section class="products" style="padding-top: 0; border: none;">
      <div id="product-list" class="product-grid">
        
        <!-- Skeleton Loading State (Replaced dynamically by js/products.js) -->
        <article class="product-card skeleton" style="pointer-events: none; border-color: transparent; box-shadow: none;">
          <div class="product-image-wrapper skeleton-box" style="border-radius: var(--radius-md);"></div>
          <div class="product-details" style="gap: var(--space-3);">
            <div class="skeleton-box" style="height: 12px; width: 40%;"></div>
            <div class="skeleton-box" style="height: 20px; width: 80%;"></div>
            <div class="skeleton-box" style="height: 24px; width: 30%; margin-top: auto;"></div>
            <div class="skeleton-box" style="height: 48px; width: 100%; border-radius: var(--radius-md);"></div>
          </div>
        </article>

        <!-- Example of how JS should inject a Product Card (for reference) -->
        <!--
        <article class="product-card">
          <div class="product-badge-group">
            <span class="badge badge-new">New</span>
          </div>
          <a href="#" class="product-image-wrapper">
            <img src="placeholder.jpg" alt="Product" class="product-image">
          </a>
          <div class="product-details">
            <span class="product-category">Essentials</span>
            <h3 class="product-title">Minimalist Ceramic Mug</h3>
            <div class="product-price-wrapper">
              <span class="product-price">$24.00</span>
            </div>
            <button class="btn btn-primary btn-full add-to-cart-btn">Add to Cart</button>
          </div>
        </article>
        -->

      </div>
    </section>

  </main>

  <!-- Minimal Footer -->
  <footer class="footer" style="margin-top: auto; padding-block: var(--space-8);">
    <div class="container text-center">
      <div class="footer-bottom" style="border: none; padding: 0; justify-content: center;">
        <p>&copy; 2026 Prasun Shop. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/products.js"></script>
  <script src="js/cart-count.js"></script>

</body>

</html>
