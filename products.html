<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Shop quality products at PRASUN SHOP."
    >

    <title>Products — PRASUN SHOP</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header class="header">

    <div class="header-container">

        <a
            href="index.html"
            class="logo"
            aria-label="PRASUN SHOP Homepage"
        >

            <svg
                width="21"
                height="21"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >

                <path
                    d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"
                ></path>

                <line
                    x1="3"
                    y1="6"
                    x2="21"
                    y2="6"
                ></line>

                <path
                    d="M16 10a4 4 0 0 1-8 0"
                ></path>

            </svg>

            <span>PRASUN SHOP</span>

        </a>


        <nav
            class="nav-links"
            aria-label="Main Navigation"
        >

            <a href="index.html">
                Shop
            </a>

            <a href="about.html">
                About
            </a>

            <a href="contact.html">
                Contact
            </a>

            <a href="checkout.html">
                Checkout
            </a>

        </nav>


        <div class="header-actions">

            <a
                href="cart.html"
                class="cart-icon-wrap"
                aria-label="View Shopping Cart"
            >

                <svg
                    width="22"
                    height="22"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >

                    <circle
                        cx="9"
                        cy="21"
                        r="1"
                    ></circle>

                    <circle
                        cx="20"
                        cy="21"
                        r="1"
                    ></circle>

                    <path
                        d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"
                    ></path>

                </svg>


                <span
                    id="cart-count"
                    class="cart-count"
                    hidden
                >
                    0
                </span>

            </a>

        </div>

    </div>

</header>



<main class="shop-container">


    <h1 class="shop-title">
        Products
    </h1>


    <p class="shop-subtitle">
        Discover products selected for everyday life.
    </p>


    <section
        class="products-toolbar"
        aria-label="Product search and sorting"
    >

        <div class="search-wrapper">

            <label
                for="product-search"
                class="sr-only"
            >
                Search products
            </label>

            <input
                id="product-search"
                class="products-search-input"
                type="search"
                placeholder="Search products..."
                autocomplete="off"
                spellcheck="false"
            >

        </div>


        <label
            for="product-sort"
            class="sr-only"
        >
            Sort products
        </label>

        <select
            id="product-sort"
            class="products-sort"
        >

            <option value="default">
                Sort
            </option>

            <option value="price-low">
                Price: Low to High
            </option>

            <option value="price-high">
                Price: High to Low
            </option>

            <option value="rating">
                Highest Rated
            </option>

            <option value="name">
                Name
            </option>

        </select>

    </section>



    <div
        id="products-categories"
        class="products-categories"
        aria-label="Product categories"
    ></div>



    <div class="products-result-bar">

        <span id="products-result-count">
            Loading products...
        </span>

    </div>



    <section
        id="product-list"
        class="product-grid"
        aria-live="polite"
        aria-busy="true"
    >

        <div class="products-loading">

            <div class="products-spinner"></div>

            <p>
                Loading products...
            </p>

        </div>

    </section>


</main>



<footer class="footer">

    <p>
        &copy; 2026 PRASUN SHOP. All rights reserved.
    </p>

</footer>



<script
    src="script.js"
    defer
></script>


</body>

</html>
