<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Products — PRASUN SHOP</title>

  <meta
    name="description"
    content="Browse products at PRASUN SHOP."
  >

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

<header class="header">

  <div class="header-container">

    <a
      href="index.html"
      class="logo"
      aria-label="PRASUN SHOP"
    >

      <svg
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <path d="M16 10a4 4 0 0 1-8 0"></path>
      </svg>

      <span>PRASUN SHOP</span>

    </a>


    <nav
      class="nav-links"
      aria-label="Main Navigation"
    >

      <a href="products.html">
        Shop
      </a>

      <a href="about.html">
        About
      </a>

      <a href="contact.html">
        Contact
      </a>

      <a href="checkout.html">
        Checkout
      </a>

      <a
        href="cart.html"
        aria-label="Shopping Cart"
      >
        Cart
        <span
          id="cart-count"
          class="cart-count"
          hidden
        >
          0
        </span>
      </a>

    </nav>

  </div>

</header>


<main class="shop-container">

  <h1 class="shop-title">
    Shop
  </h1>

  <p class="shop-subtitle">
    Discover our latest products.
  </p>


  <!-- SEARCH + SORT -->

  <section
    class="products-toolbar"
    aria-label="Product search and sorting"
  >

    <div class="search-wrapper">

      <label
        for="products-search"
        class="sr-only"
      >
        Search products
      </label>

      <input
        id="products-search"
        class="products-search-input"
        type="search"
        placeholder="Search products..."
        autocomplete="off"
      >

    </div>


    <select
      id="products-sort"
      class="products-sort"
      aria-label="Sort products"
    >

      <option value="default">
        Featured
      </option>

      <option value="price-low">
        Price: Low to High
      </option>

      <option value="price-high">
        Price: High to Low
      </option>

      <option value="name">
        Name: A–Z
      </option>

    </select>

  </section>


  <!-- CATEGORIES -->

  <div
    id="products-categories"
    class="products-categories"
    aria-label="Product categories"
  >
  </div>


  <!-- RESULT COUNT -->

  <div
    class="products-result-bar"
  >

    <span id="products-result-count">
      Loading products...
    </span>

  </div>


  <!-- PRODUCTS -->

  <section
    id="products-container"
    aria-live="polite"
    aria-label="Products"
  >

    <div
      class="products-loading"
    >
      <div class="loading-spinner"></div>

      <p>
        Loading products...
      </p>

    </div>

  </section>

</main>


<footer class="footer">

  <p>
    &copy; 2026 PRASUN SHOP. All rights reserved.
  </p>

</footer>


<script
  src="script.js"
  defer
></script>

</body>
</html>
