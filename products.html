<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore our collection of minimal and modern products at Prasun Shop.">
  <title>Products — Prasun Shop</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <!-- Optional Custom CSS Override -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-zinc-50 text-zinc-900 font-sans antialiased selection:bg-zinc-900 selection:text-white min-h-screen flex flex-col">

  <!-- Navigation Bar -->
  <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-zinc-200/80">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <!-- Brand Logo -->
      <a href="index.html" class="text-xl font-bold tracking-tight text-zinc-900 hover:opacity-80 transition-opacity">
        Prasun Shop<span class="text-zinc-400">.</span>
      </a>

      <!-- Desktop Nav Links -->
      <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-zinc-600">
        <a href="index.html" class="hover:text-zinc-900 transition-colors">Home</a>
        <a href="products.html" class="text-zinc-900 font-semibold border-b-2 border-zinc-900 pb-0.5">Products</a>
        <a href="#" class="hover:text-zinc-900 transition-colors">About</a>
        <a href="#" class="hover:text-zinc-900 transition-colors">Contact</a>
      </nav>

      <!-- Cart Icon & Actions -->
      <div class="flex items-center gap-4">
        <a href="#" class="relative p-2 text-zinc-700 hover:text-zinc-900 transition-colors" aria-label="Shopping Cart">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
          </svg>
          <span id="cart-count" class="absolute top-1 right-1 inline-flex items-center justify-center min-w-[18px] h-[18px] px-1 text-[10px] font-bold text-white bg-zinc-900 rounded-full">0</span>
        </a>
      </div>

    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
    
    <!-- Header Controls / Filter Section -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between pb-8 border-b border-zinc-200 mb-8 gap-4">
      <div>
        <h1 class="text-3xl font-extrabold tracking-tight text-zinc-900">Our Products</h1>
        <p class="text-sm text-zinc-500 mt-1">Discover high-quality essentials crafted for modern life.</p>
      </div>

      <!-- Search & Filter Controls -->
      <div class="flex items-center gap-3">
        <div class="relative flex-grow sm:w-64">
          <input type="text" placeholder="Search items..." class="w-full bg-white border border-zinc-200 rounded-lg pl-9 pr-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-zinc-900/10 focus:border-zinc-900 transition-all">
          <svg class="w-4 h-4 absolute left-3 top-2.5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- Dynamic Product Grid -->
    <section class="products">
      <div id="product-list" class="product-grid grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        
        <!-- Skeleton Loading State (Replaced dynamically by js/products.js) -->
        <div class="animate-pulse bg-white border border-zinc-200/60 rounded-2xl p-4 flex flex-col gap-3">
          <div class="bg-zinc-200 aspect-square rounded-xl"></div>
          <div class="h-4 bg-zinc-200 rounded w-3/4"></div>
          <div class="h-3 bg-zinc-200 rounded w-1/2"></div>
          <div class="h-8 bg-zinc-200 rounded-lg mt-auto"></div>
        </div>

      </div>
    </section>

  </main>

  <!-- Minimal Footer -->
  <footer class="border-t border-zinc-200 bg-white py-8 mt-auto">
    <div class="max-w-7xl mx-auto px-4 text-center text-xs text-zinc-500">
      <p>&copy; 2026 Prasun Shop. All rights reserved.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/products.js"></script>
  <script src="js/cart-count.js"></script>

</body>

</html>
