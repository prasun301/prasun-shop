<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore premium digital products from Prasun Shop.">
    <meta name="theme-color" content="#ffffff">
    <title>Products — Prasun Shop</title>
    <link rel="stylesheet" href="style.css">
    <style>
/* ==========================================================
   PRASUN SHOP — PRODUCTS PAGE (ENTERPRISE REFACTOR OPTIMIZED)
   ========================================================== */
:root {
    --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    --bg-primary: #ffffff;
    --bg-secondary: #fafafa;
    --bg-muted: #f4f4f5;
    --text-primary: #18181b;
    --text-secondary: #52525b;
    --text-muted: #71717a;
    --text-subtle: #a1a1aa;
    --border-color: #e4e4e7;
    --border-hover: #d4d4d8;
    --border-dark: #18181b;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 14px;
    --radius-full: 999px;
    --transition-fast: 150ms ease;
    --transition-base: 180ms ease;
    --transition-smooth: 220ms cubic-bezier(0.2, 0.7, 0.2, 1);
    --max-width: 1360px;
}

.products-page {
    min-height: 100vh;
    background: var(--bg-primary);
    font-family: var(--font-sans);
    color: var(--text-primary);
}

/* Header */
.products-header {
    position: sticky;
    top: 0;
    z-index: 100;
    height: 72px;
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--border-color);
}

.products-header-inner {
    width: min(100% - 40px, var(--max-width));
    height: 100%;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.products-brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: var(--text-primary);
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.025em;
    text-decoration: none;
    white-space: nowrap;
}

.products-brand-icon {
    width: 25px;
    height: 25px;
    display: grid;
    place-items: center;
    color: var(--text-primary);
}

.products-brand-icon svg {
    width: 24px;
    height: 24px;
}

.products-nav {
    display: flex;
    align-items: center;
    gap: 34px;
    margin-left: auto;
    margin-right: 48px;
}

.products-nav a {
    position: relative;
    color: var(--text-secondary);
    font-size: 15px;
    font-weight: 500;
    text-decoration: none;
    transition: color var(--transition-base);
}

.products-nav a:hover,
.products-nav a.active {
    color: var(--text-primary);
}

.products-nav a.active::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -25px;
    height: 2px;
    background: var(--border-dark);
    border-radius: var(--radius-full);
}

.products-header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
}

.products-icon-button {
    position: relative;
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    color: #27272a;
    background: transparent;
    border: 0;
    border-radius: 10px;
    cursor: pointer;
    transition: background var(--transition-base), color var(--transition-base);
}

.products-icon-button:hover {
    background: var(--bg-muted);
}

.products-icon-button svg {
    width: 22px;
    height: 22px;
}

.products-cart-badge {
    position: absolute;
    top: 1px;
    right: 0;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--border-dark);
    color: var(--bg-primary);
    border-radius: var(--radius-full);
    font-size: 10px;
    font-weight: 700;
    line-height: 1;
}

.products-menu-button {
    display: none;
}

.products-mobile-menu {
    display: none;
    position: absolute;
    left: 20px;
    right: 20px;
    top: 80px;
    background: var(--bg-primary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 8px;
    box-shadow: 0 15px 45px rgba(0, 0, 0, 0.10);
}

.products-mobile-menu.open {
    display: block;
}

.products-mobile-menu a {
    display: block;
    padding: 12px 14px;
    color: var(--text-secondary);
    border-radius: 9px;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
}

.products-mobile-menu a:hover,
.products-mobile-menu a.active {
    background: var(--bg-muted);
    color: var(--text-primary);
}

/* Main Layout */
.products-main {
    width: min(100% - 40px, var(--max-width));
    margin: 0 auto;
    padding: 64px 0 90px;
}

.products-hero {
    display: grid;
    grid-template-columns: 1fr 480px;
    align-items: end;
    gap: 60px;
    margin-bottom: 42px;
}

.products-eyebrow {
    margin: 0 0 12px;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
}

.products-heading {
    margin: 0;
    color: var(--text-primary);
    font-size: clamp(38px, 5vw, 52px);
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -0.045em;
}

.products-intro {
    max-width: 600px;
    margin: 18px 0 0;
    color: var(--text-muted);
    font-size: 17px;
    line-height: 1.65;
}

/* Search */
.products-search {
    position: relative;
    width: 100%;
}

.products-search-icon {
    position: absolute;
    left: 17px;
    top: 50%;
    width: 19px;
    height: 19px;
    color: var(--text-muted);
    transform: translateY(-50%);
    pointer-events: none;
}

.products-search-input {
    width: 100%;
    height: 56px;
    padding: 0 74px 0 50px;
    background: var(--bg-primary);
    border: 1px solid var(--border-hover);
    border-radius: var(--radius-md);
    color: var(--text-primary);
    font-size: 15px;
    outline: none;
    transition: border-color var(--transition-base), box-shadow var(--transition-base);
}

.products-search-input::placeholder {
    color: var(--text-subtle);
}

.products-search-input:hover {
    border-color: var(--text-subtle);
}

.products-search-input:focus {
    border-color: var(--border-dark);
    box-shadow: 0 0 0 3px rgba(24, 24, 27, 0.08);
}

.products-search-shortcut {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 5px 7px;
    color: var(--text-muted);
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    font-size: 11px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

/* Filter Toolbar */
.products-toolbar {
    margin-bottom: 28px;
}

.products-categories {
    display: flex;
    align-items: center;
    gap: 12px;
    overflow-x: auto;
    scrollbar-width: none;
}

.products-categories::-webkit-scrollbar {
    display: none;
}

.category-pill {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 46px;
    padding: 0 22px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-full);
    background: var(--bg-primary);
    color: var(--text-secondary);
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    transition: background var(--transition-base), border-color var(--transition-base), color var(--transition-base), transform var(--transition-fast);
}

.category-pill:hover {
    border-color: var(--text-subtle);
    color: var(--text-primary);
}

.category-pill.active {
    background: var(--border-dark);
    border-color: var(--border-dark);
    color: var(--bg-primary);
}

.category-pill:active {
    transform: scale(0.98);
}

/* Results Bar */
.products-results-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 18px;
}

.products-count {
    margin: 0;
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 500;
}

.products-sort {
    height: 44px;
    padding: 0 38px 0 14px;
    color: var(--text-secondary);
    background: var(--bg-primary);
    border: 1px solid var(--border-color);
    border-radius: 9px;
    font-size: 14px;
    cursor: pointer;
    outline: none;
}

.products-sort:focus {
    border-color: var(--border-dark);
}

/* Product Grid */
.products-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 24px;
}

/* Product Card */
.product-card {
    min-width: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg-primary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.025);
    transition: transform var(--transition-smooth), box-shadow var(--transition-smooth), border-color var(--transition-smooth);
}

.product-card:hover {
    transform: translateY(-3px);
    border-color: var(--border-hover);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.075);
}

.product-card-link {
    display: block;
    color: inherit;
    text-decoration: none;
}

.product-card-image {
    width: 100%;
    aspect-ratio: 1.28 / 1;
    overflow: hidden;
    background: var(--bg-muted);
}

.product-card-image img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    transition: transform 400ms cubic-bezier(0.2, 0.7, 0.2, 1);
}

.product-card:hover .product-card-image img {
    transform: scale(1.035);
}

.product-card-body {
    display: flex;
    flex-direction: column;
    flex: 1;
    padding: 20px;
}

.product-category {
    margin: 0 0 9px;
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
}

.product-title {
    margin: 0;
    color: var(--text-primary);
    font-size: 17px;
    font-weight: 650;
    line-height: 1.3;
    letter-spacing: -0.015em;
}

.product-description {
    display: -webkit-box;
    overflow: hidden;
    margin: 9px 0 18px;
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.55;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
}

.product-bottom {
    margin-top: auto;
}

.product-price {
    margin: 0 0 17px;
    color: var(--text-primary);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.025em;
}

.product-cart-button {
    width: 100%;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    padding: 0 16px;
    color: var(--bg-primary);
    background: var(--border-dark);
    border: 0;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background var(--transition-base), transform var(--transition-fast);
}

.product-cart-button:hover {
    background: #27272a;
}

.product-cart-button:active {
    transform: scale(0.985);
}

.product-cart-button svg {
    width: 17px;
    height: 17px;
}

/* Empty State */
.products-empty {
    padding: 80px 24px;
    text-align: center;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    background: var(--bg-secondary);
}

.products-empty.hidden {
    display: none;
}

.products-empty-icon {
    width: 52px;
    height: 52px;
    margin: 0 auto 18px;
    display: grid;
    place-items: center;
    color: var(--text-muted);
    background: var(--bg-muted);
    border-radius: 50%;
}

.products-empty-icon svg {
    width: 23px;
    height: 23px;
}

.products-empty h2 {
    margin: 0;
    color: var(--text-primary);
    font-size: 20px;
}

.products-empty p {
    margin: 8px 0 20px;
    color: var(--text-muted);
    font-size: 14px;
}

.products-empty-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 42px;
    padding: 0 18px;
    background: var(--border-dark);
    color: var(--bg-primary);
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    border: 0;
    cursor: pointer;
}

/* Skeleton */
.product-skeleton {
    overflow: hidden;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    background: var(--bg-primary);
}

.skeleton-image {
    aspect-ratio: 1.28 / 1;
    background: var(--bg-muted);
}

.skeleton-content {
    padding: 20px;
}

.skeleton-line {
    height: 12px;
    margin-bottom: 10px;
    background: linear-gradient(90deg, var(--bg-muted) 25%, var(--border-color) 50%, var(--bg-muted) 75%);
    background-size: 200% 100%;
    border-radius: 6px;
    animation: skeleton-loading 1.4s infinite;
}

.skeleton-line.short { width: 35%; }
.skeleton-line.medium { width: 65%; }
.skeleton-line.long { width: 90%; }

@keyframes skeleton-loading {
    from { background-position: 200% 0; }
    to { background-position: -200% 0; }
}

.hidden { display: none !important; }

.sr-only {
    position: absolute; 
    width: 1px; 
    height: 1px; 
    padding: 0; 
    margin: -1px;
    overflow: hidden; 
    clip: rect(0, 0, 0, 0); 
    white-space: nowrap; 
    border: 0;
}

/* Responsive Queries */
@media (max-width: 1100px) {
    .products-hero {
        grid-template-columns: 1fr 380px;
        gap: 40px;
    }
    .products-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
    }
}

@media (max-width: 850px) {
    .products-nav { display: none; }
    .products-menu-button { display: grid; }
    .products-header-inner { width: min(100% - 32px, var(--max-width)); }
    .products-main { width: min(100% - 32px, var(--max-width)); padding-top: 48px; }
    .products-hero { grid-template-columns: 1fr; gap: 28px; }
    .products-search { max-width: 560px; }
    .products-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 560px) {
    .products-header { height: 64px; }
    .products-brand { font-size: 17px; }
    .products-brand-icon { width: 22px; height: 22px; }
    .products-header-actions { gap: 2px; }
    .products-icon-button { width: 38px; height: 38px; }
    .products-main { width: min(100% - 24px, var(--max-width)); padding: 36px 0 60px; }
    .products-heading { font-size: 36px; }
    .products-intro { font-size: 15px; }
    .products-search-input { height: 52px; }
    .products-results-bar { align-items: flex-start; flex-direction: column; gap: 12px; }
    .products-sort { width: 100%; }
    .products-grid { grid-template-columns: 1fr; gap: 18px; }
    .product-card-image { aspect-ratio: 1.5 / 1; }
    .product-card-body { padding: 18px; }
    .products-categories { margin-right: -12px; padding-right: 12px; }
}

:focus-visible { 
    outline: 2px solid var(--border-dark); 
    outline-offset: 3px; 
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
    }
}
    </style>
</head>
<body>
    <div class="products-page">
        <!-- HEADER -->
        <header class="products-header">
            <div class="products-header-inner">
                <a href="index.html" class="products-brand" aria-label="Prasun Shop Home">
                    <span class="products-brand-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 9.5h16" />
                            <path d="M5 9.5V19h14V9.5" />
                            <path d="M3 9.5l2-5h14l2 5" />
                            <path d="M8 19v-5h8v5" />
                        </svg>
                    </span>
                    <span>Prasun Shop</span>
                </a>
                <nav class="products-nav" aria-label="Primary Navigation">
                    <a href="index.html">Home</a>
                    <a href="products.html" class="active" aria-current="page">Products</a>
                    <a href="about.html">About</a>
                    <a href="contact.html">Contact</a>
                </nav>
                <div class="products-header-actions">
                    <a href="cart.html" class="products-icon-button" aria-label="Shopping cart">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 1.9-1.4L21 8H6" />
                            <circle cx="10" cy="20" r="1.3" />
                            <circle cx="18" cy="20" r="1.3" />
                        </svg>
                        <span id="cart-count" class="products-cart-badge" aria-live="polite" aria-atomic="true">0</span>
                    </a>
                    <button type="button" id="products-menu-toggle" class="products-icon-button products-menu-button" aria-label="Open navigation menu" aria-controls="products-mobile-menu" aria-expanded="false">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                            <path d="M4 7h16" /><path d="M4 12h16" /><path d="M4 17h16" />
                        </svg>
                    </button>
                </div>
            </div>
            <div id="products-mobile-menu" class="products-mobile-menu">
                <a href="index.html">Home</a>
                <a href="products.html" class="active" aria-current="page">Products</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </div>
        </header>

        <!-- MAIN -->
        <main class="products-main">
            <section class="products-hero" aria-labelledby="products-heading">
                <div>
                    <p class="products-eyebrow">Prasun Shop</p>
                    <h1 id="products-heading" class="products-heading">Explore Our Products</h1>
                
                </div>
                <form class="products-search" id="product-search-form" role="search" onsubmit="return false;">
                    <label for="product-search" class="sr-only">Search products</label>
                    <svg class="products-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="7" /><path d="m20 20-4-4" />
                    </svg>
                    <input id="product-search" class="products-search-input" type="search" placeholder="Search products..." autocomplete="off" spellcheck="false" enterkeyhint="search" aria-label="Search products">
                    <span class="products-search-shortcut" aria-hidden="true">⌘ K</span>
                </form>
            </section>

            <section class="products-toolbar" aria-label="Product categories">
                <div class="products-categories">
                    <button type="button" class="category-pill active" data-category="all" aria-current="page">All Products</button>
                    <button type="button" class="category-pill" data-category="electronics">Electronics</button>
                    <button type="button" class="category-pill" data-category="lifestyle">Lifestyle</button>
                    <button type="button" class="category-pill" data-category="accessories">Accessories</button>
                    <button type="button" class="category-pill" data-category="smart">Smart Tech</button>
                </div>
            </section>

            <div class="products-results-bar">
                <p id="products-count" class="products-count" aria-live="polite">Loading products...</p>
                <label>
                    <span class="sr-only">Sort products</span>
                    <select id="product-sort" class="products-sort" aria-label="Sort products">
                        <option value="featured">Sort by: Featured</option>
                        <option value="price-low">Price: Low to High</option>
                        <option value="price-high">Price: High to Low</option>
                        <option value="name">Name: A to Z</option>
                    </select>
                </label>
            </div>

            <!-- PRODUCT GRID -->
            <section id="product-list" class="products-grid" aria-busy="true" aria-label="Products">
                <!-- Skeletons rendered initially -->
                <article class="product-skeleton"><div class="skeleton-image"></div><div class="skeleton-content"><div class="skeleton-line short"></div><div class="skeleton-line medium"></div><div class="skeleton-line long"></div><div class="skeleton-line medium"></div></div></article>
                <article class="product-skeleton"><div class="skeleton-image"></div><div class="skeleton-content"><div class="skeleton-line short"></div><div class="skeleton-line medium"></div><div class="skeleton-line long"></div><div class="skeleton-line medium"></div></div></article>
                <article class="product-skeleton"><div class="skeleton-image"></div><div class="skeleton-content"><div class="skeleton-line short"></div><div class="skeleton-line medium"></div><div class="skeleton-line long"></div><div class="skeleton-line medium"></div></div></article>
                <article class="product-skeleton"><div class="skeleton-image"></div><div class="skeleton-content"><div class="skeleton-line short"></div><div class="skeleton-line medium"></div><div class="skeleton-line long"></div><div class="skeleton-line medium"></div></div></article>
            </section>

            <div id="empty-state" class="products-empty hidden">
                <div class="products-empty-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="7" /><path d="m20 20-4-4" />
                    </svg>
                </div>
                <h2>No products found</h2>
                <p>Try another search term or browse all products.</p>
                <button type="button" class="products-empty-button" id="empty-reset-btn">View All Products</button>
            </div>
        </main>
    </div>

    <!-- PRODUCT CARD TEMPLATE -->
    <template id="product-card-template">
        <article class="product-card">
            <a class="product-card-link" href="#">
                <div class="product-card-image">
                    <img src="" alt="" loading="lazy" decoding="async">
                </div>
            </a>
            <div class="product-card-body">
                <p class="product-category"></p>
                <h2 class="product-title"></h2>
                <p class="product-description"></p>
                <div class="product-bottom">
                    <p class="product-price"></p>
                    <button type="button" class="product-cart-button" data-action="cart" aria-label="Add product to cart">
                        <span>Add to Cart</span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 1.9-1.4L21 8H6" />
                            <circle cx="10" cy="20" r="1.3" />
                            <circle cx="18" cy="20" r="1.3" />
                        </svg>
                    </button>
                </div>
            </div>
        </article>
    </template>

    <!-- EMBEDDED APPLICATION SCRIPT -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Sample dataset
            const products = [
                { id: 1, name: "Advanced UI Kit Pro", category: "electronics", price: 49.00, description: "Enterprise-grade UI components for modern web apps.", image: "https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=600&q=80" },
                { id: 2, name: "Minimalist Desk Pad", category: "lifestyle", price: 29.00, description: "Smooth waterproof PU leather desk mat for productivity.", image: "https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?auto=format&fit=crop&w=600&q=80" },
                { id: 3, name: "Ergonomic Laptop Stand", category: "accessories", price: 39.00, description: "Adjustable aluminum stand for improved posture.", image: "https://images.unsplash.com/photo-1527864550417-7fd91fc51a46?auto=format&fit=crop&w=600&q=80" },
                { id: 4, name: "Smart Wireless Hub", category: "smart", price: 89.00, description: "Multi-port connectivity hub with fast charging support.", image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=600&q=80" },
                { id: 5, name: "Developer Icon Pack", category: "electronics", price: 19.00, description: "Vector icon sets optimized for software developers.", image: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80" }
            ];

            // State management
            let currentCategory = 'all';
            let searchQuery = '';
            let currentSort = 'featured';

            // DOM Elements
            const gridEl = document.getElementById('product-list');
            const countEl = document.getElementById('products-count');
            const emptyEl = document.getElementById('empty-state');
            const searchInput = document.getElementById('product-search');
            const sortSelect = document.getElementById('product-sort');
            const categoryPills = document.querySelectorAll('.category-pill');
            const menuToggle = document.getElementById('products-menu-toggle');
            const mobileMenu = document.getElementById('products-mobile-menu');
            const cartCountEl = document.getElementById('cart-count');
            const emptyResetBtn = document.getElementById('empty-reset-btn');
            const template = document.getElementById('product-card-template');

            // Mobile Menu Toggle
            menuToggle?.addEventListener('click', () => {
                const expanded = menuToggle.getAttribute('aria-expanded') === 'true';
                menuToggle.setAttribute('aria-expanded', !expanded);
                mobileMenu.classList.toggle('open');
            });

            // Cart badge sync
            function updateCartBadge() {
                const cart = JSON.parse(localStorage.getItem('prasun_cart') || '[]');
                const totalItems = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
                if (cartCountEl) cartCountEl.textContent = totalItems;
            }
            updateCartBadge();

            // Render products function
            function renderProducts() {
                gridEl.setAttribute('aria-busy', 'true');
                
                // Filter logic
                let filtered = products.filter(item => {
                    const matchesCat = currentCategory === 'all' || item.category === currentCategory;
                    const matchesSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                          item.description.toLowerCase().includes(searchQuery.toLowerCase());
                    return matchesCat && matchesSearch;
                });

                // Sort logic
                if (currentSort === 'price-low') {
                    filtered.sort((a, b) => a.price - b.price);
                } else if (currentSort === 'price-high') {
                    filtered.sort((a, b) => b.price - a.price);
                } else if (currentSort === 'name') {
                    filtered.sort((a, b) => a.name.localeCompare(b.name));
                }

                gridEl.innerHTML = '';

                if (filtered.length === 0) {
                    emptyEl.classList.remove('hidden');
                    countEl.textContent = '0 products found';
                    gridEl.setAttribute('aria-busy', 'false');
                    return;
                }

                emptyEl.classList.add('hidden');
                countEl.textContent = `Showing ${filtered.length} product${filtered.length === 1 ? '' : 's'}`;

                const fragment = document.createDocumentFragment();
                filtered.forEach(product => {
                    const clone = template.content.cloneNode(true);
                    
                    const img = clone.querySelector('img');
                    img.src = product.image;
                    img.alt = product.name;

                    clone.querySelector('.product-category').textContent = product.category;
                    clone.querySelector('.product-title').textContent = product.name;
                    clone.querySelector('.product-description').textContent = product.description;
                    clone.querySelector('.product-price').textContent = `$${product.price.toFixed(2)}`;

                    // Cart button interaction
                    const cartBtn = clone.querySelector('.product-cart-button');
                    cartBtn.addEventListener('click', () => {
                        let cart = JSON.parse(localStorage.getItem('prasun_cart') || '[]');
                        const existing = cart.find(item => item.id === product.id);
                        if (existing) {
                            existing.quantity = (existing.quantity || 1) + 1;
                        } else {
                            cart.push({ ...product, quantity: 1 });
                        }
                        localStorage.setItem('prasun_cart', JSON.stringify(cart));
                        updateCartBadge();

                        // Visual feedback state
                        const originalHTML = cartBtn.innerHTML;
                        cartBtn.innerHTML = `<span>Added!</span> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:17px;height:17px;"><path d="M20 6 9 17l-5-5"/></svg>`;
                        cartBtn.style.background = '#10b981';
                        setTimeout(() => {
                            cartBtn.innerHTML = originalHTML;
                            cartBtn.style.background = '';
                        }, 1200);
                    });

                    // Card link behavior
                    const cardLink = clone.querySelector('.product-card-link');
                    cardLink.addEventListener('click', (e) => {
                        e.preventDefault();
                        window.location.href = `product-detail.html?id=${product.id}`;
                    });

                    fragment.appendChild(clone);
                });

                gridEl.appendChild(fragment);
                gridEl.setAttribute('aria-busy', 'false');
            }

            // Initial render
            setTimeout(() => {
                renderProducts();
            }, 250);

            // Event Listeners
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value.trim();
                renderProducts();
            });

            sortSelect.addEventListener('change', (e) => {
                currentSort = e.target.value;
                renderProducts();
            });

            categoryPills.forEach(pill => {
                pill.addEventListener('click', () => {
                    categoryPills.forEach(p => {
                        p.classList.remove('active');
                        p.removeAttribute('aria-current');
                    });
                    pill.classList.add('active');
                    pill.setAttribute('aria-current', 'page');
                    currentCategory = pill.getAttribute('data-category');
                    renderProducts();
                });
            });

            emptyResetBtn.addEventListener('click', () => {
                currentCategory = 'all';
                searchQuery = '';
                searchInput.value = '';
                currentSort = 'featured';
                sortSelect.value = 'featured';
                categoryPills.forEach(p => {
                    if (p.getAttribute('data-category') === 'all') {
                        p.classList.add('active');
                        p.setAttribute('aria-current', 'page');
                    } else {
                        p.classList.remove('active');
                        p.removeAttribute('aria-current');
                    }
                });
                renderProducts();
            });

            // Keyboard shortcut (Cmd+K / Ctrl+K) for search focus
            document.addEventListener('keydown', (e) => {
                if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
                    e.preventDefault();
                    searchInput.focus();
                    searchInput.select();
                }
            });
        });
    </script>
</body>
</html>
